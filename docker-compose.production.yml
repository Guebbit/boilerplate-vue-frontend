# Production stack for the frontend.
#
# `docker-compose.yml` is the DEVELOPMENT stack: it bind-mounts the working tree and runs the Vite
# dev server. This one builds the static bundle and serves it with nginx.
#
#   docker compose -f docker-compose.production.yml up -d --build
#   docker compose -f docker-compose.production.yml logs -f frontend
#
# ── ONE IMAGE, CONFIGURED WHEN IT STARTS ─────────────────────────────────────────────────────────
# `VITE_APP_BASE_URL` is the one value Vite still bakes into every asset URL at build time — it is
# the only build arg below. Everything else is `environment:`: `docker/docker-entrypoint.d/`
# writes it into `/config.js` fresh at every container start, so changing it is `up -d`, not a
# rebuild. See the long note at the top of `docker/Dockerfile.production`.
#
# Set these in a `.env` file beside this one (compose interpolates it automatically) or export them
# in the shell. `VITE_API_URL` is required and has no sensible default: a frontend pointed at the
# wrong API is a frontend that looks fine and does nothing.

services:
    frontend:
        build:
            context: .
            dockerfile: docker/Dockerfile.production
            args:
                VITE_APP_BASE_URL: '${VITE_APP_BASE_URL:-/}'

        environment:
            # Required. The `:?` form fails the container's own start-up rather than quietly
            # shipping an app that calls itself.
            VITE_API_URL: '${VITE_API_URL:?set VITE_API_URL}'
            VITE_API_SSE: '${VITE_API_SSE:-}'
            VITE_APP_DEFAULT_LOCALE: '${VITE_APP_DEFAULT_LOCALE:-en}'
            VITE_APP_FALLBACK_LOCALE: '${VITE_APP_FALLBACK_LOCALE:-en}'
            # `warn` rather than the development default: the browser console is a user-facing
            # surface in production, and request-level logging there is noise at best.
            VITE_APP_LOG_LEVEL: '${VITE_APP_LOG_LEVEL:-warn}'
            VITE_AXIOS_TIMEOUT: '${VITE_AXIOS_TIMEOUT:-30000}'
            VITE_MAX_UPLOAD_BYTES: '${VITE_MAX_UPLOAD_BYTES:-5242880}'
            # Off unless set: seconds between re-reads of the cart for its per-line stock flag.
            VITE_CART_STOCK_POLL_SECONDS: '${VITE_CART_STOCK_POLL_SECONDS:-}'
            # Telemetry. All optional — an unset value disables the integration entirely rather
            # than pointing it at nothing.
            VITE_FARO_URL: '${VITE_FARO_URL:-}'
            VITE_FARO_APP_NAME: '${VITE_FARO_APP_NAME:-frontend}'
            VITE_FARO_APP_VERSION: '${VITE_FARO_APP_VERSION:-}'
            VITE_FARO_ENVIRONMENT: '${VITE_FARO_ENVIRONMENT:-production}'
            VITE_UMAMI_SRC: '${VITE_UMAMI_SRC:-}'
            VITE_UMAMI_WEBSITE_ID: '${VITE_UMAMI_WEBSITE_ID:-}'
            VITE_UMAMI_REQUIRE_CONSENT: '${VITE_UMAMI_REQUIRE_CONSENT:-}'
            VITE_TOURS_ENABLED: '${VITE_TOURS_ENABLED:-}'
            # The helpdesk's public URL: staff get a "Helpdesk" link only when it is set.
            VITE_ZAMMAD_URL: '${VITE_ZAMMAD_URL:-}'
            # /.well-known/security.txt — published only when both CONTACT and EXPIRES are set.
            VITE_SECURITY_CONTACT: '${VITE_SECURITY_CONTACT:-}'
            VITE_SECURITY_EXPIRES: '${VITE_SECURITY_EXPIRES:-}'
            VITE_SECURITY_POLICY_URL: '${VITE_SECURITY_POLICY_URL:-}'
            # Search indexing — off unless this is `true`; see docs/operate/environment.md.
            VITE_ROBOTS_INDEX: '${VITE_ROBOTS_INDEX:-}'

        restart: unless-stopped

        # Hardening, in the order the CIS Docker Benchmark asks for it (container user in section
        # 4; capabilities, read-only root filesystem and no new privileges in section 5):
        #   - the image runs as uid 101 (`nginx-unprivileged`), so nothing here is root;
        #   - `read_only` makes the root filesystem immutable, so a compromised nginx cannot
        #     rewrite the app it serves;
        #   - `cap_drop: [ALL]`: serving a port above 1024 needs no capability;
        #   - `no-new-privileges` stops a setuid binary from regaining any.
        # What must stay writable is a small tmpfs: nginx's pid and temp files, and
        # `/tmp/runtime`, where the entrypoint writes `config.js` and friends at every start.
        # `noexec,nosuid`: nothing written there can be run or elevate.
        read_only: true
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true
        tmpfs:
            - /tmp:mode=1777,size=16m,noexec,nosuid

        ports:
            # Loopback only. Terminate TLS in a reverse proxy in front of this — the API sets
            # authentication cookies, and those must not cross a plain-HTTP hop. The container
            # side is 8080: uid 101 may not bind a port below 1024.
            - '127.0.0.1:${FRONTEND_PORT:-8080}:8080'
# ── WHY THE API IS NOT A SERVICE HERE ────────────────────────────────────────────────────────────
# The two repositories deploy independently: the frontend is a bundle on a CDN or an nginx
# container, the API is a long-running process next to its databases. Declaring the API here would
# make one repository's compose file the owner of the other's deployment, and the version skew
# between them would stop being visible.
#
# What connects them is `VITE_API_URL` above and the OpenAPI contract the API publishes. To run
# both locally as a deployment rehearsal, bring up the API's own
# `docker-compose.production.yml` first, then build this with
# `VITE_API_URL=http://localhost:3000` — the same two commands a real deploy runs, in the same
# order, which is what makes the rehearsal worth anything.
