extends:
    - 'spectral:oas'

rules:
    # --- Quality gates ---
    operation-operationId: error
    operation-tags: error

    # Its `given` filter dereferences every visited node, and Spectral 6.16 visits a `null` value
    # (the `null` member of a 3.1 `type: 'null'` union, an `example: null`) — a crash, not a
    # finding. No schema here has an `enum` worth checking for duplicates that codegen would not.
    duplicated-entry-in-enum: off

    # --- OpenAPI 3.1 has no `nullable` ---
    # 3.1 adopted JSON Schema 2020-12, where `nullable: true` is an unknown keyword that tools
    # ignore silently. Write `type: [X, 'null']`, or `oneOf` with `{ type: 'null' }` around a `$ref`.
    no-nullable-keyword:
        description: "`nullable` is OpenAPI 3.0. In 3.1 write `type: [X, 'null']`, or `oneOf` with `{ type: 'null' }` around a `$ref`."
        severity: error
        given: "$..[?(@property === 'nullable' && @parentProperty !== 'properties')]"
        then:
            function: schema
            functionOptions:
                schema:
                    not: {}

    # --- Catch the common typo: $refs instead of $ref ---
    no-refs-typo:
        description: "Do not use '$refs' (typo). Use '$ref'."
        severity: error
        given: '$..$refs'
        then:
            function: truthy

    # --- operationId naming: camelCase, no HTTP verb prefix ---
    operation-id-no-http-verb-prefix:
        description: 'operationId must not start with an HTTP verb (post, put, get). Use semantic verbs: list, create, update, delete, search, get, login, signup, etc (delete is allowed).'
        severity: error
        given: '$.paths[*][*].operationId'
        then:
            function: pattern
            functionOptions:
                notMatch: '^(post|put|patch)[A-Z]'

    operation-id-camel-case:
        description: 'operationId must be camelCase.'
        severity: error
        given: '$.paths[*][*].operationId'
        then:
            function: pattern
            functionOptions:
                match: '^[a-z][a-zA-Z0-9]*$'

    # --- Request schema naming conventions ---
    request-schema-no-http-verb-prefix:
        description: 'Request schema names must not start with an HTTP verb (Post, Put, Patch, Get). Use semantic names: CreateXRequest, UpdateXRequest, DeleteXRequest, SearchXRequest, etc (Delete is allowed).'
        severity: error
        given: '$.components.schemas'
        then:
            field: '@key'
            function: pattern
            functionOptions:
                notMatch: '^(Post|Put|Patch|Get)[A-Z].*Request$'

    request-schema-pascal-case:
        description: 'Request schema names must be PascalCase.'
        severity: error
        given: '$.components.schemas[?(@property.match(/Request$/))]~'
        then:
            function: pattern
            functionOptions:
                match: '^[A-Z][a-zA-Z0-9]*Request$'

    # --- Response schema naming conventions ---
    response-schema-no-http-verb-prefix:
        description: 'Response schema names must not start with an HTTP verb (Post, Put, Patch, Get). Use semantic names: UsersResponse, CartResponse, CheckoutResponse, etc (Delete is allowed).'
        severity: error
        given: '$.components.schemas'
        then:
            field: '@key'
            function: pattern
            functionOptions:
                notMatch: '^(Post|Put|Patch|Get)[A-Z].*Response$'

    response-schema-pascal-case:
        description: 'Response schema names must be PascalCase.'
        severity: error
        given: '$.components.schemas[?(@property.match(/Response$/))]~'
        then:
            function: pattern
            functionOptions:
                match: '^[A-Z][a-zA-Z0-9]*Response$'

    # --- Parameter naming ---
    # Header parameters are excluded: their `name` is the literal wire header
    # (e.g. `x-antibot-challenge-token`), conventionally kebab-case, not an
    # identifier this rule's camelCase check was ever meant to police.
    parameter-name-camel-case:
        description: 'Parameter names must be camelCase (query/path only — header names are the wire header itself).'
        severity: error
        given: '$.components.parameters[?(@.in != "header")].name'
        then:
            function: pattern
            functionOptions:
                match: '^[a-z][a-zA-Z0-9]*$'
