# nginx configuration for the production frontend image.
#
# Serves the Vite build output as a single-page application. Paired with
# `.docker/Dockerfile.production`, which copies this to /etc/nginx/conf.d/default.conf.
#
# `nginx.docs.conf` next to this file is the equivalent for the VitePress documentation site. They
# look similar and are deliberately separate: this one has to answer for client-side routes that
# correspond to no file on disk, and that changes the fallback and the caching rules.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the exact nginx version in the Server header and error pages.
    server_tokens off;

    # ── Compression ──────────────────────────────────────────────────────────────────────────────
    # A Vue bundle is mostly JavaScript, which compresses to roughly a third of its size. `gzip`
    # rather than `brotli` because the stock nginx image does not carry the brotli module; if the
    # bundle is large enough for the difference to matter, precompress at build time and serve the
    # files with `gzip_static`/`brotli_static` instead of compressing on every request.
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        font/woff
        font/woff2;

    # ── Security headers ─────────────────────────────────────────────────────────────────────────
    # `always` matters: without it a header is attached to 2xx/3xx responses only, and the error
    # pages — the ones most worth hardening — go out bare.
    #
    # ⚠ THESE FOUR LINES ARE REPEATED IN EVERY `location` BLOCK BELOW, AND THE REPETITION IS
    # LOAD-BEARING. `add_header` does not merge across levels: a `location` that declares even one
    # `add_header` of its own DISCARDS every one inherited from `server`. Since each location below
    # sets its own `Cache-Control`, a server-level security header would silently vanish from every
    # response the site actually serves — which is exactly what happened here, and was caught by
    # curl-ing the running container rather than by reading the file.
    #
    # So: any new `location` that sets a header must also carry this block. The alternative is an
    # `include` file, which costs a second COPY in the Dockerfile and hides the rule that bites.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Deny the device APIs this application never asks for, so a future dependency cannot either.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # A Content-Security-Policy is NOT set here, and the omission is deliberate rather than an
    # oversight. A correct one depends on choices this file cannot see: whether Grafana Faro and
    # Umami are enabled (each needs its own `script-src` and `connect-src` origin), which API host
    # the bundle was built against, and whether Vuetify's runtime styles need `style-src
    # 'unsafe-inline'`. A policy guessed here would either break the app or be permissive enough to
    # be theatre. Set it at the reverse proxy, where the environment is known, and test it in
    # report-only mode first:
    #
    #   add_header Content-Security-Policy-Report-Only "default-src 'self'; connect-src 'self' https://api.example.com; ..." always;
    #
    # `Strict-Transport-Security` belongs at the TLS-terminating proxy for the same reason: this
    # container speaks plain HTTP on a private network and cannot know the public scheme.

    # ── Caching ──────────────────────────────────────────────────────────────────────────────────
    # Vite fingerprints everything it emits under /assets (`app.BFCykUYc.js`), so the filename
    # changes whenever the content does. That makes an immutable year-long cache safe AND correct:
    # a client never needs to revalidate, and a deploy invalidates by producing new names.
    # One `Cache-Control`, not two: `expires 1y` emits its own, and combined with an `add_header`
    # the response carries the directive twice. Setting max-age inside the add_header keeps it to
    # a single, readable header.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        access_log off;
        try_files $uri =404;
    }

    # Fonts and images outside /assets are copied verbatim from `public/` and keep their names
    # across deploys, so they get a shorter cache and a revalidation rather than an immutable one.
    location ~* \.(?:woff2?|ttf|eot|otf|png|jpe?g|gif|svg|webp|avif|ico)$ {
        add_header Cache-Control "public, max-age=2592000, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        access_log off;
    }

    # index.html is the one file that must never be cached. It is what names the current bundle;
    # a stale copy points at asset filenames that a deploy has already deleted, and the app boots
    # into a blank page with 404s in the console until the browser gives up the entry.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        expires off;
    }

    # ── Routing ──────────────────────────────────────────────────────────────────────────────────
    # vue-router runs in history mode, so `/en/products/42` is a real URL a visitor can type,
    # bookmark or reload — and it corresponds to no file. Hand any unmatched path to index.html and
    # let the router resolve it, including the locale prefix segment.
    #
    # `$uri/` before the fallback so a genuine directory with an index still wins, and the fallback
    # is the LAST resort: without `try_files` a reload of a deep link is a plain 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # A request for a missing asset should fail as a missing asset. Without this, `try_files` above
    # hands `/assets/typo.js` back as index.html with a 200 and a `text/html` content type, and the
    # browser reports a confusing MIME-type error instead of the 404 that actually happened.
    location = /404.html {
        internal;
    }
}
