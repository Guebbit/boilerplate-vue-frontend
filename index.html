<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="%APP_NAME% — a Vue 3 storefront boilerplate: products, cart, orders and account, ready to be shaped into your own shop."
        />
        <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png" />
        <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png" />
        <link rel="manifest" href="/favicon/site.webmanifest" />
        <link rel="mask-icon" href="/favicon/safari-pinned-tab.svg" color="#5bbad5" />
        <link rel="shortcut icon" href="/favicon/favicon.ico" />
        <meta name="msapplication-TileColor" content="#ffffff" />
        <meta name="msapplication-config" content="/favicon/browserconfig.xml" />
        <meta name="theme-color" content="#ffffff" />
        <!-- Replaced on every navigation by the router (`<page> — <app name>`); this is the pre-boot default. -->
        <title>%APP_NAME%</title>
        <!--
          a static splash, shown until Vue mounts and replaces `#app`'s content. Vue cannot
          render anything before its own bootstrap settles (locale merge, first navigation), so a
          slow API otherwise leaves a blank page for however long that takes — this is the one
          piece of UI that exists before any JavaScript has run. Plain CSS, no framework: Vuetify
          and Tailwind are what is still loading.
        -->
        <style>
            #app-splash {
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                font-family: system-ui, sans-serif;
                color: #616161;
                background: #fafafa;
            }
            @media (prefers-color-scheme: dark) {
                #app-splash {
                    color: #e0e0e0;
                    background: #121212;
                }
            }
            #app-splash__spinner {
                width: 2rem;
                height: 2rem;
                border: 0.25rem solid currentColor;
                border-right-color: transparent;
                border-radius: 50%;
                animation: app-splash-spin 0.75s linear infinite;
            }
            @media (prefers-reduced-motion: reduce) {
                #app-splash__spinner {
                    animation: none;
                }
            }
            @keyframes app-splash-spin {
                to {
                    transform: rotate(360deg);
                }
            }
        </style>
    </head>
    <body>
        <noscript
            >This application needs JavaScript to run. Please enable it in your browser and reload
            the page.</noscript
        >
        <div id="app">
            <div id="app-splash" role="status" aria-label="Loading">
                <div id="app-splash__spinner" aria-hidden="true"></div>
            </div>
        </div>
        <!--
          Written fresh by `docker/docker-entrypoint.d/` at every container start — absent in dev,
          unit tests and `vite preview`, where it 404s harmlessly and
          `src/infrastructure/runtime-config.ts`'s reader falls back to `import.meta.env`. Must
          load before the app bundle below.
        -->
        <script src="./config.js"></script>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
