name: Setup Node and install
description: >-
    Sets up Node from `.nvmrc` (with the npm cache) and runs `npm ci` — the two steps every job
    in `ci.yml` repeated after its own checkout (13 call sites, byte-identical). NOT the checkout
    itself: a local composite action can only be resolved once the repository running it is
    already checked out, so each job keeps its own explicit `actions/checkout` step first.

runs:
    using: composite
    steps:
        - name: Setup Node
          uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
          with:
              node-version-file: .nvmrc
              cache: npm
              cache-dependency-path: package-lock.json

        - name: Install dependencies
          shell: bash
          run: npm ci
