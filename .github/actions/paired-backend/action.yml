name: Checkout and install the paired backend
description: >-
    Checks out the sibling backend repository at a given path and installs its dependencies —
    the five call sites this replaces (ci.yml's test-unit/spec-identity/test-e2e jobs,
    e2e-live.yml, visual.yml) differed only in the checkout path, whether a failed checkout is
    reported as the job's own error, and whether the install is skipped for a sibling with no
    package.json (a PHP pair commits its own bundled contract and has nothing to install).

inputs:
    repository:
        description: >-
            The backend repository to check out, as owner/name. Passed in by each caller because a
            composite action cannot read the `vars` context.
        required: false
        default: Guebbit/boilerplate-node-backend
    token:
        description: >-
            Token for the checkout. Passed in by each caller because a composite action cannot read
            the `secrets` context; the caller falls back to its own github.token.
        required: true
    path:
        description: Where the checkout lands, relative to the workspace.
        required: false
        default: .backend
    report-failure:
        description: >-
            'true' to continue past a failed checkout and fail the job with a message naming the
            SPEC_SIBLING_REPO/SPEC_SIBLING_TOKEN fix, instead of failing on the checkout step
            itself. Every e2e-shaped job wants this; the plain contract-comparison jobs do too.
        required: false
        default: 'false'
    no-backend-mode:
        description: >-
            Free text describing what the caller cannot do without a backend, interpolated into
            the failure message report-failure prints (e.g. "The e2e suite boots its demo
            profile, so there is no backend-less mode"). Ignored when report-failure is 'false'.
        required: false
        default: ''
    guarded-install:
        description: >-
            'true' to skip the install when the checkout has no package.json (a PHP sibling) and
            to set MONGOMS_DISABLE_POSTINSTALL=1 (the caller bundles a contract, never runs the
            backend, so mongodb-memory-server's own postinstall download is pure waste). 'false'
            installs unconditionally with no such guard, for a caller that always needs a
            runnable backend.
        required: false
        default: 'false'

    setup-mongod:
        description: >-
            'true' to install a system `mongod` and export MONGOMS_SYSTEM_BINARY, for a caller that
            boots several demo backends at once. Left to itself each one downloads the binary into
            the shared `~/.cache/mongodb-binaries` behind a lockfile, and concurrent first starts
            corrupt it ("Cannot unlock file ... because it is not locked by this process"): every
            backend died on boot. Same recipe as the backend repo's own `setup` action.
        required: false
        default: 'false'

runs:
    using: composite
    steps:
        - name: Checkout paired backend
          id: sibling
          continue-on-error: ${{ inputs.report-failure == 'true' }}
          uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
          with:
              repository: ${{ inputs.repository }}
              path: ${{ inputs.path }}
              token: ${{ inputs.token }}

        - name: Report an unreachable sibling
          if: inputs.report-failure == 'true' && steps.sibling.outcome == 'failure'
          shell: bash
          run: |
              echo "::error::Could not check out the paired backend "\
              "(${{ inputs.repository }}). "\
              "${{ inputs.no-backend-mode }}${{ inputs.no-backend-mode != '' && ': ' || '' }}"\
              "set the SPEC_SIBLING_REPO variable, or add a SPEC_SIBLING_TOKEN secret if it is "\
              "private."
              exit 1

        - name: Install backend dependencies
          if: inputs.guarded-install != 'true' || hashFiles(format('{0}/package.json', inputs.path)) != ''
          working-directory: ${{ inputs.path }}
          shell: bash
          env:
              MONGOMS_DISABLE_POSTINSTALL: ${{ inputs.guarded-install == 'true' && '1' || '' }}
          run: npm ci

        - name: Install mongod
          if: inputs.setup-mongod == 'true'
          shell: bash
          run: |
              if command -v mongod >/dev/null 2>&1; then
                  echo "MONGOMS_SYSTEM_BINARY=$(command -v mongod)" >> "$GITHUB_ENV"
                  exit 0
              fi

              sudo apt-get update
              sudo apt-get install -y gnupg curl
              curl -fsSL https://pgp.mongodb.com/server-8.0.asc | gpg --dearmor | sudo tee /usr/share/keyrings/mongodb-server-8.0.gpg >/dev/null
              echo "deb [ signed-by=/usr/share/keyrings/mongodb-server-8.0.gpg ] https://repo.mongodb.org/apt/ubuntu $(lsb_release -cs)/mongodb-org/8.0 multiverse" | sudo tee /etc/apt/sources.list.d/mongodb-org-8.0.list
              sudo apt-get update
              sudo apt-get install -y mongodb-org-server
              echo "MONGOMS_SYSTEM_BINARY=$(command -v mongod)" >> "$GITHUB_ENV"
