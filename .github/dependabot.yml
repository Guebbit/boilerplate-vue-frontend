version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      # Dependabot's PR title becomes the squash commit subject, so it must be conventional.
      commit-message:
          prefix: build
          prefix-development: build
          include: scope
      # A release must be a week old before Dependabot proposes it: a hijacked or yanked version is
      # usually caught inside that window.
      # https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference#cooldown-
      cooldown:
          default-days: 7
      # One weekly PR for every minor/patch bump together, so a routine dependency update
      # doesn't turn into a dozen review requests. A major stays OUT of the group on purpose —
      # https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/grouping-pull-requests
      # a breaking bump gets its own PR, reviewed on its own, never silently folded into a
      # weekly batch of everything else that happened to update the same week.
      groups:
          minor-and-patch:
              applies-to: version-updates
              update-types:
                  - minor
                  - patch

    - package-ecosystem: github-actions
      # The workflows live under /.github/workflows; `directories` adds each composite action.
      directories:
          - /
          - /.github/actions/*
      schedule:
          interval: weekly
      # Dependabot's PR title becomes the squash commit subject, so it must be conventional.
      commit-message:
          prefix: build
          include: scope
      cooldown:
          default-days: 7
      groups:
          minor-and-patch:
              applies-to: version-updates
              update-types:
                  - minor
                  - patch
