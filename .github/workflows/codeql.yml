name: CodeQL

# Static security analysis: GitHub's CodeQL engine reads this app's TypeScript and Vue source
# looking for vulnerability patterns (XSS sinks, unsafe URL handling, injection) and files what it
# finds under the repo's Security tab rather than as a build failure.
#
# Complements `audit` in ci.yml, which asks a different question: `npm audit` checks our
# DEPENDENCIES against a CVE database, this checks the code WE wrote. Neither sees the other's
# half.

on:
    pull_request:
    push:
        branches:
            - main
    schedule:
        # Catch newly-disclosed query patterns against unchanged code.
        - cron: '17 3 * * 1'

permissions:
    contents: read

concurrency:
    group: codeql-${{ github.ref }}
    cancel-in-progress: true

jobs:
    analyze:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
            # Required to upload findings; the analyze step below writes them, nothing else does.
            security-events: write
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            # Picks the query pack and sets up the extractor. No build step: JS/TS is analysed
            # from source, so unlike compiled languages nothing has to run first.
            - name: Initialize CodeQL
              uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
              with:
                  languages: javascript-typescript

            # Runs the queries and uploads the SARIF results to the Security tab. `category`
            # namespaces them, so a future second language analysed here does not overwrite these.
            - name: Perform CodeQL analysis
              uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2
              with:
                  category: '/language:javascript-typescript'
