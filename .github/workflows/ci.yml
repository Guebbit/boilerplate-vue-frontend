name: CI

# The merge gate. Everything here runs on every PR and on every push to main, and the aggregate
# `ci` job at the bottom is the single check branch protection requires.
#
# Deliberately many small jobs rather than one `npm run complete`: they run in parallel, and
# a red square names the thing that broke (formatting? contract? e2e?) without anyone opening a
# log. The trade is repeated checkout/setup/install boilerplate in each.
#
# The jobs fall into four groups:
#   - style           commitlint, lint, prettier
#   - contract        lint-openapi, lint-asyncapi, api-freshness, asyncapi-types-freshness,
#                     spec-identity — the spec is valid, its generated output is committed and
#                     current, and the paired backend still agrees with it
#   - correctness     typecheck, build, test-unit, test-e2e
#   - supply chain    audit
#
# The slow and non-hermetic suites live elsewhere on a nightly schedule: e2e-live.yml (against a
# real backend) and mutation.yml.

on:
    # Run on every PR and on direct pushes to main.
    # This gives fast feedback for feature branches and protects main.
    pull_request:
    push:
        branches:
            - main

concurrency:
    # Cancel stale runs for the same branch/PR when newer commits arrive.
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    NODE_VERSION: 22

jobs:
    commitlint:
        # Lint pushed commit messages against the conventional-commit rules in .commitlintrc.cjs.
        # Only meaningful on push (needs the before/after SHAs from the push event).
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  # Need full history to walk the pushed commit range.
                  fetch-depth: 0

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Lint commit messages
              run: npx commitlint --from ${{ github.event.before }} --to ${{ github.event.after }} --verbose

    lint:
        # ESLint over src, tests and scripts.
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint

    prettier:
        # Formatting only — a separate job from `lint` so "you forgot to format" and "you wrote
        # a lint error" are two different red squares.
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Check formatting
              run: npm run prettier:check

    lint-openapi:
        # Spectral lints openapi.yaml against spectral.yaml, the ruleset the paired backend lints
        # its identical copy under.
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Lint OpenAPI spec
              run: npm run lint:openapi

    lint-asyncapi:
        # The same, for the realtime contract behind the SSE types.
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Lint AsyncAPI spec
              run: npm run lint:asyncapi

    asyncapi-types-freshness:
        # Verify the committed generated AsyncAPI types are up-to-date with asyncapi.yaml.
        # Mirrors the backend's job of the same name — asyncapi.yaml is kept byte-identical
        # between the two repos by hand, and this is the within-repo half of that guard:
        # it cannot detect cross-repo drift, only a spec edited without regenerating here.
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: Install dependencies
              run: npm ci

            # The generator itself compares, so the committed file is never overwritten here and
            # the job needs no git state to read a verdict out of.
            - name: Check generated AsyncAPI types are fresh
              run: npm run check:asyncapi-types

    audit:
        # Scoped to the production dependency tree only: devDependencies (build
        # tooling, codegen, test runners, etc.) are never shipped to users, so a
        # vulnerability there carries a very different risk than one in a package
        # that ends up in the bundle. Gating on the full tree (incl. dev) tends to
        # block on things nobody can actually fix, which just trains people to
        # ignore the check.
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Audit production dependencies
              run: npm audit --omit=dev --audit-level=high

    api-freshness:
        # Verify the committed generated API client is up-to-date with openapi.yaml.
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Check generated API client is fresh
              # The pathspec must list every orval output in orval.config.ts. It previously
              # read `api/` — a directory this repo has never had — so `git diff` matched
              # nothing, exited 0, and the job passed without checking anything from the day
              # it was written. If you add or retarget an output block in orval.config.ts,
              # update this list in the same commit.
              run: |
                  npm run gen:api
                  # orval emits 2-space indentation; this repo's prettier config uses 4, and
                  # the committed output is formatted. Without this normalisation step the
                  # diff below is thousands of lines of pure indentation on every run.
                  npx prettier --write contracts/
                  if ! git diff --exit-code -- contracts/; then
                      echo "Generated API client is stale. Run 'npm run gen:api && npm run prettier:fix' and commit the changes."
                      exit 1
                  fi
                  # `git diff` only sees tracked files, so a brand-new generated output would
                  # slip through as untracked. Catch that too.
                  if [ -n "$(git status --porcelain -- contracts/)" ]; then
                      echo "Codegen produced untracked files under contracts/:"
                      git status --porcelain -- contracts/
                      echo "Run 'npm run gen:api' and commit the changes."
                      exit 1
                  fi

    typecheck:
        # `vue-tsc` — types across .ts and .vue alike. `build` below repeats it as part of its
        # own script; this job exists so a type error is reported as one, not as a build failure.
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Type check
              run: npm run type-check-only

    build:
        # Proves the app still builds from a clean checkout.
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build-only

    test-unit:
        # Vitest: components, stores, composables and the http layer, in jsdom.
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Run unit tests with coverage
              run: npm run test:unit:coverage

            - name: Per-module test report
              # Reads the JSON the run just wrote and prints the rollup into the job log, so a
              # red build names the MODULE before anyone opens an artifact.
              if: always()
              run: npm run test:unit:report && npm run test:report

            - name: Upload test report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: test-report-unit
                  path: reports/test-report.json
                  retention-days: 14
                  if-no-files-found: ignore

            - name: Upload coverage report
              # Visibility only, not a gate: with no established baseline yet, a hard
              # threshold would either block unrelated PRs or get set so low it's
              # meaningless. Publish the report so trends are visible; revisit once
              # we know a realistic number (ideally as a patch-coverage check).
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-report
                  path: coverage/
                  retention-days: 14

    spec-identity:
        # The cross-repo contract gate.
        #
        # Seven files exist in BOTH repos, byte-identical — the REST contract, the shared half of
        # the async contract, the spectral ruleset both sides lint under, the frontend's analytics
        # event names, and three shared scripts. `scripts/spec-identity.ts` holds the list and
        # says, per entry, what a fork of it would break — and, for what is deliberately absent,
        # why comparing an OUTPUT of a compared input would add nothing.
        #
        # Until this job existed they were checked by nothing. Every other spec job here lints
        # THIS repo's copy and passes, because a forked spec is still a valid spec. What nobody
        # could see was the fork itself.
        #
        # Two of the seven sit at different paths in each repo (the async contract is published
        # there as `asyncapi.public.yaml` and received here as `asyncapi.yaml`; the analytics names
        # are authored there under a `.frontend` suffix the two lint configs disagree about), which
        # is why the list is path *pairs* rather than names — a same-path check could not express
        # them, so they went unguarded longest.
        #
        # The sibling is checked out read-only, at its default branch: the question is whether this
        # PR agrees with what the backend has actually shipped, not with some pinned older copy.
        #
        # A fork in the pair is a genuine failure, but an unreachable sibling is an infrastructure
        # problem — so `checkout` is allowed to fail and the step below says which of the two
        # happened. A copy of this boilerplate that has no paired backend should delete this job
        # rather than watch it fail forever.
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Checkout paired backend
              id: sibling
              continue-on-error: true
              uses: actions/checkout@v4
              with:
                  # Override with a repository variable when the pair lives elsewhere.
                  repository: ${{ vars.SPEC_SIBLING_REPO || 'Guebbit/boilerplate-node-backend' }}
                  path: .spec-sibling
                  # Only needed when the sibling is private; falls back to this repo's token.
                  token: ${{ secrets.SPEC_SIBLING_TOKEN || github.token }}

            - name: Report an unreachable sibling
              if: steps.sibling.outcome == 'failure'
              run: |
                  echo "::error::Could not check out the paired backend "\
                  "(${{ vars.SPEC_SIBLING_REPO || 'Guebbit/boilerplate-node-backend' }}). "\
                  "Set the SPEC_SIBLING_REPO variable, add a SPEC_SIBLING_TOKEN secret if it is "\
                  "private, or delete this job if this copy has no paired backend."
                  exit 1

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Compare the shared contract files
              env:
                  BACKEND_PATH: .spec-sibling
              run: npm run check:spec-identity

    test-e2e:
        # Cypress against the paired backend's DEMO profile: the real API on an in-memory Mongo,
        # one instance per shard, cache and queue disabled. Fast because nothing persists and
        # nothing is composed — `test-e2e-live` below is the job that attaches the real datastores,
        # and when the two disagree it wins. See docs/tools/demo-profile.md.
        #
        # The sibling checkout is what `scripts/e2e-shard.ts` boots, so this job needs it as much
        # as `spec-identity` above does — with its dependencies installed, since the demo profile
        # runs through tsx.
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
        env:
            # Where the backend checkout lands, and what scripts/backend-path.ts resolves. Same
            # name and same value as e2e-live.yml, so the two e2e jobs describe one layout.
            BACKEND_PATH: .backend
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Checkout paired backend
              id: sibling
              continue-on-error: true
              uses: actions/checkout@v4
              with:
                  # Override with a repository variable when the pair lives elsewhere.
                  repository: ${{ vars.SPEC_SIBLING_REPO || 'Guebbit/boilerplate-node-backend' }}
                  path: .backend
                  # Only needed when the sibling is private; falls back to this repo's token.
                  token: ${{ secrets.SPEC_SIBLING_TOKEN || github.token }}

            - name: Report an unreachable sibling
              if: steps.sibling.outcome == 'failure'
              run: |
                  echo "::error::Could not check out the paired backend "\
                  "(${{ vars.SPEC_SIBLING_REPO || 'Guebbit/boilerplate-node-backend' }}). "\
                  "The e2e suite boots its demo profile, so there is no backend-less mode: set "\
                  "the SPEC_SIBLING_REPO variable, or add a SPEC_SIBLING_TOKEN secret if it is "\
                  "private."
                  exit 1

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: Cache Cypress binary
              uses: actions/cache@v4
              with:
                  path: ~/.cache/Cypress
                  key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
                  restore-keys: |
                      cypress-${{ runner.os }}-

            - name: Install dependencies
              run: npm ci

            # The shard runner spawns `npm --prefix .backend run demo`, which is tsx against the
            # backend's own dependency tree — an uninstalled checkout would fail at require time,
            # after the 120s readiness poll rather than at the point of the mistake.
            - name: Install backend dependencies
              working-directory: ${{ env.BACKEND_PATH }}
              run: npm ci

            - name: Run e2e tests
              run: npm run test:e2e

            - name: Upload failing-shard logs
              # `e2e-shard.ts` writes a failed shard's full Cypress output here. Uploaded because
              # stderr is the one copy that can be lost to a truncated log, and once it is the
              # failure is undiagnosable.
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: e2e-shard-logs
                  path: reports/e2e/
                  retention-days: 14
                  if-no-files-found: ignore

            - name: Upload Cypress screenshots
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: cypress-screenshots
                  path: tests/e2e/screenshots
                  retention-days: 14
                  if-no-files-found: ignore

            - name: Upload Cypress videos
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: cypress-videos
                  path: tests/e2e/videos
                  retention-days: 14
                  if-no-files-found: ignore

    test-e2e-live:
        # The behaviour gate: the same specs as `test-e2e` above, against the fully composed stack
        # — a real backend checkout, a real Mongo and a real Redis — rather than against the demo
        # profile's in-memory database with the cache and queue disabled.
        #
        # Delegated rather than duplicated — `e2e-live.yml` owns the datastore services, the
        # sibling checkout and the seeding, and is also scheduled nightly on its own. Two copies of
        # that setup would drift, which is the exact failure mode this whole job exists to close.
        uses: ./.github/workflows/e2e-live.yml
        # SPEC_SIBLING_TOKEN, for checking out the paired backend.
        secrets: inherit

    ci:
        # Single status check to require in branch protection, so adding/renaming
        # jobs above doesn't require updating the required-checks list every time.
        if: always()
        # Every job above belongs in this list. `commitlint` only runs on push
        # (see its `if:`), so on pull requests it reports `skipped` — which is
        # neither `failure` nor `cancelled`, so listing it here is safe and does
        # not block PRs.
        needs:
            - commitlint
            - lint
            - prettier
            - lint-openapi
            - lint-asyncapi
            - asyncapi-types-freshness
            - audit
            - api-freshness
            - typecheck
            - build
            - test-unit
            - test-e2e
            - test-e2e-live
            - spec-identity
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Check all jobs succeeded
              run: |
                  if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
                      echo "One or more required jobs failed."
                      exit 1
                  fi
