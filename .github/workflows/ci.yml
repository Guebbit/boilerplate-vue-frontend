name: CI

# The merge gate. Everything here runs on every PR and on every push to main, and the aggregate
# `ci` job at the bottom is the single check to require in branch protection. That rule is a GitHub
# setting, not a file: nothing here enforces it until the repository owner creates it.
#
# Deliberately many small jobs rather than one `npm run complete`: they run in parallel, and
# a red square names the thing that broke (formatting? contract? e2e?) without anyone opening a
# log. The trade is repeated checkout/setup/install boilerplate in each.
#
# The jobs fall into four groups:
#   - style           commitlint, lint, prettier
#   - contract        lint-openapi, lint-asyncapi, api-freshness, asyncapi-types-freshness,
#                     spec-identity — the spec is valid, its generated output is committed and
#                     current, and the paired backend still agrees with it
#   - correctness     typecheck, build, test-unit, test-e2e
#   - supply chain    audit
#   - adoption        demo-strip-measure — report-only: it is not in the `ci` job's `needs:`
#
# The slow and non-hermetic suites live in their own workflows: e2e-live.yml (against a real
# backend; this file calls it as the `test-e2e-live` job and it also runs nightly) and
# mutation.yml (nightly only).

on:
    # Run on every PR and on direct pushes to main.
    # This gives fast feedback for feature branches and protects main.
    pull_request:
    push:
        branches:
            - main

permissions:
    contents: read

concurrency:
    # Cancel stale runs for the same branch/PR when newer commits arrive.
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    # `npm ci` runs cypress's own postinstall, which downloads its ~200 MB binary — needed by
    # `test-e2e` below and nowhere else in this workflow. Set back to unset (which means "install
    # it") only on that one job.
    CYPRESS_INSTALL_BINARY: '0'

jobs:
    commitlint:
        # Lint commit messages against the conventional-commit rules in .commitlintrc.cjs, over
        # the PR's own base..head range on a pull request, or the pushed range on a direct push to
        # main. FA129: linting only on push let a badly-worded commit sit on a PR unnoticed until
        # AFTER it merged into main — this job now runs where a PR author can still see it fail.
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  # Need full history to walk the commit range below — every other job's shallow
                  # default is enough, which is why this checkout stays its own step rather than
                  # going through `setup-node-and-install`.
                  fetch-depth: 0

            - name: Setup Node and install
              uses: ./.github/actions/setup-node-and-install

            - name: Lint commit messages
              # A pull_request event carries no before/after SHAs — base/head is its own pair, and
              # the range a reviewer actually sees. A push event (direct to main) keeps before/after.
              run: |
                  npx commitlint \
                    --from ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }} \
                    --to ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.after }} \
                    --verbose

    lint:
        # ESLint over src, tests and scripts.
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - name: Setup Node and install
              uses: ./.github/actions/setup-node-and-install

            - name: Lint
              run: npm run lint

    prettier:
        # Formatting only — a separate job from `lint` so "you forgot to format" and "you wrote
        # a lint error" are two different red squares.
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - name: Setup Node and install
              uses: ./.github/actions/setup-node-and-install

            - name: Check formatting
              run: npm run prettier:check

    lint-openapi:
        # Spectral lints openapi.yaml against spectral.yaml, the ruleset the paired backend lints
        # its identical copy under.
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - name: Setup Node and install
              uses: ./.github/actions/setup-node-and-install

            - name: Lint OpenAPI spec
              run: npm run lint:openapi

    lint-asyncapi:
        # The same, for the realtime contract behind the SSE types.
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - name: Setup Node and install
              uses: ./.github/actions/setup-node-and-install

            - name: Lint AsyncAPI spec
              run: npm run lint:asyncapi

    asyncapi-types-freshness:
        # Verify the committed generated AsyncAPI types are up-to-date with asyncapi.yaml.
        # Mirrors the backend's job of the same name — asyncapi.yaml is kept byte-identical
        # between the two repos by hand, and this is the within-repo half of that guard:
        # it cannot detect cross-repo drift, only a spec edited without regenerating here.
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - name: Setup Node and install
              uses: ./.github/actions/setup-node-and-install

            # The generator itself compares, so the committed file is never overwritten here and
            # the job needs no git state to read a verdict out of.
            - name: Check generated AsyncAPI types are fresh
              run: npm run check:asyncapi-types

    docs-references:
        # Every path the docs CLAIM exists, checked against the files that do. `docs:build` fails
        # on a dead LINK between pages; nothing else fails on a dead FACT, and a page naming a
        # source file that no longer exists reads as current to anyone who has not opened the tree.
        # Mirrors the backend's job of the same name, each repo reading its own tree.
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - name: Setup Node and install
              uses: ./.github/actions/setup-node-and-install

            # No sibling checkout here, so the cross-repo half is skipped rather than failed —
            # see the script's `peerTargets`.
            - name: Check every path the docs cite still exists
              run: npm run check:docs-references

            - name: Build the docs site
              # The other half of this job's own docblock: a dead LINK between pages, which
              # `check:docs-references` above does not look for.
              run: npm run docs:build

    docker-image:
        # Neither this image nor the docs site (job above) was ever built in CI — so a Dockerfile
        # break, or a build arg silently dropped from `docker/Dockerfile.production`, first
        # surfaced on whoever tried to deploy. This builds it and proves the running container
        # actually serves the app at the domain root — the sub-path case is NOT covered here: it
        # needs a design call first, see the note on `docker/nginx.conf`.
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - name: Build the production image
              run: docker build -f docker/Dockerfile.production -t boilerplate-frontend:ci .

            - name: Run it and prove it serves the app
              run: |
                  docker run -d --name frontend-smoke -p 8080:80 \
                    -e VITE_API_URL=http://localhost:3000 \
                    -e VITE_APP_NAME='CI Smoke Test' \
                    boilerplate-frontend:ci
                  # The entrypoint script writes config.js on start; give it a moment before curling.
                  sleep 2

                  echo 'index.html, with the no-store cache headers:'
                  curl --fail --silent --show-error --include http://localhost:8080/ \
                    | tee /tmp/index-headers.txt
                  grep -qi 'cache-control: no-cache, no-store' /tmp/index-headers.txt

                  echo 'config.js, written by the entrypoint from this container'"'"'s own env:'
                  curl --fail --silent --show-error http://localhost:8080/config.js \
                    | tee /tmp/config.js
                  grep -q 'CI Smoke Test' /tmp/config.js

                  echo 'a missing asset is a 404, not the SPA fallback:'
                  status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
                    http://localhost:8080/assets/does-not-exist.js)
                  test "$status" = '404'

                  echo 'a deep link falls back to index.html for vue-router to resolve:'
                  status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
                    http://localhost:8080/en/products/42)
                  test "$status" = '200'

            - name: Container logs (always, for debugging a failed smoke test)
              if: always()
              run: docker logs frontend-smoke

            - name: Clean up
              if: always()
              run: docker rm -f frontend-smoke || true

    audit:
        # Scoped to the production dependency tree only: devDependencies (build
        # tooling, codegen, test runners, etc.) are never shipped to users, so a
        # vulnerability there carries a very different risk than one in a package
        # that ends up in the bundle. Gating on the full tree (incl. dev) tends to
        # block on things nobody can actually fix, which just trains people to
        # ignore the check.
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - name: Setup Node and install
              uses: ./.github/actions/setup-node-and-install

            - name: Audit production dependencies
              run: npm audit --omit=dev --audit-level=high

    demo-strip-measure:
        # FE-D4 step 1 (the backend's G-D2 twin): how far "the demo shop is removable" actually
        # is, measured rather than assumed. Deletes every module src/demo-modules.ts names from a
        # scratch copy and runs type-check-only, lint and build-only against what's left.
        #
        # Deliberately NOT in the `ci` gate's `needs:` below: this
        # is not expected to be green on its own — it does not edit src/modules.ts, so the
        # dangling imports it leaves behind ARE the measurement, the same punch list `npm run
        # demo:remove` (which DOES edit it) clears. A red square here is a signal to look, not a
        # blocked PR.
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - name: Setup Node and install
              uses: ./.github/actions/setup-node-and-install

            - name: Measure the demo-shop strip
              run: npm run measure:demo-strip

    api-freshness:
        # Verify the committed generated API client is up-to-date with openapi.yaml.
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - name: Setup Node and install
              uses: ./.github/actions/setup-node-and-install

            - name: Check generated API client is fresh
              # The pathspec must list every orval output in orval.config.ts. It previously
              # read `api/` — a directory this repo has never had — so `git diff` matched
              # nothing, exited 0, and the job passed without checking anything from the day
              # it was written. If you add or retarget an output block in orval.config.ts,
              # update this list in the same commit.
              run: |
                  npm run gen:api
                  # orval emits 2-space indentation; this repo's prettier config uses 4, and
                  # the committed output is formatted. Without this normalisation step the
                  # diff below is thousands of lines of pure indentation on every run.
                  npx prettier --write contracts/
                  if ! git diff --exit-code -- contracts/; then
                      echo "Generated API client is stale. Run 'npm run gen:api && npm run prettier:fix' and commit the changes."
                      exit 1
                  fi
                  # `git diff` only sees tracked files, so a brand-new generated output would
                  # slip through as untracked. Catch that too.
                  if [ -n "$(git status --porcelain -- contracts/)" ]; then
                      echo "Codegen produced untracked files under contracts/:"
                      git status --porcelain -- contracts/
                      echo "Run 'npm run gen:api' and commit the changes."
                      exit 1
                  fi

    typecheck:
        # `vue-tsc` — types across .ts and .vue alike. `build` below repeats it as part of its
        # own script; this job exists so a type error is reported as one, not as a build failure.
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - name: Setup Node and install
              uses: ./.github/actions/setup-node-and-install

            - name: Type check
              run: npm run type-check-only

    build:
        # Proves the app still builds from a clean checkout.
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - name: Setup Node and install
              uses: ./.github/actions/setup-node-and-install

            - name: Build
              run: npm run build-only

    test-unit:
        # Vitest: components, stores, composables and the http layer, in jsdom. No paired backend
        # here — the one unit case that needed a real sibling checkout is `spec-identity`'s own
        # job below, which does its own checkout for exactly that.
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - name: Setup Node and install
              uses: ./.github/actions/setup-node-and-install

            - name: Run unit tests with coverage and a JSON report
              # One vitest invocation, two reporters (`default` for the log, `json` for the
              # rollup below) plus coverage — FA99: this used to be two full suite runs, one via
              # `test:unit:coverage` and a second via `test:unit:report`, ~doubling the job's
              # actual test time for a report the first run could already produce.
              run: npm run test:unit:ci

            - name: Per-module test report
              # Reads the JSON the run above already wrote and prints the rollup into the job
              # log, so a red build names the MODULE before anyone opens an artifact. No test run
              # of its own.
              if: always()
              run: npm run test:report

            - name: Upload test report
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: test-report-unit
                  path: reports/test-report.json
                  retention-days: 14
                  if-no-files-found: ignore

            - name: Upload coverage report
              # The gate is "Run unit tests with coverage and a JSON report" above:
              # `vitest.config.ts` sets per-file thresholds, and a file under its floor fails that
              # step. This upload is the detail behind that verdict — which lines are missed —
              # and runs on failure for exactly that.
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: coverage-report
                  path: coverage/
                  retention-days: 14

    spec-identity:
        # The cross-repo contract gate.
        #
        # Two files exist in BOTH repos, byte-identical — the REST contract and the shared half
        # of the async contract. `scripts/pairing/spec-identity.ts` holds the list and says, per entry,
        # what a fork of it would break — and, for what is deliberately absent, why comparing an
        # OUTPUT of a compared input would add nothing.
        #
        # Until this job existed they were checked by nothing. Every other spec job here lints
        # THIS repo's copy and passes, because a forked spec is still a valid spec. What nobody
        # could see was the fork itself.
        #
        # One of the two sits at a different path in each repo: the async contract is published
        # there as `asyncapi.public.yaml` and received here as `asyncapi.yaml`. That is why the
        # list is path *pairs* rather than names — a same-path check could not express it, so it
        # went unguarded longest.
        #
        # The sibling is checked out read-only, at its default branch: the question is whether this
        # PR agrees with what the backend has actually shipped, not with some pinned older copy.
        #
        # A fork in the pair is a genuine failure, but an unreachable sibling is an infrastructure
        # problem — so `checkout` is allowed to fail and the step below says which of the two
        # happened. A copy of this boilerplate that has no paired backend should delete this job
        # rather than watch it fail forever.
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - name: Setup Node and install
              uses: ./.github/actions/setup-node-and-install

            # Same reasoning as test-unit's own step: the sibling's openapi.yaml is gitignored
            # there and only exists once its postinstall assembles it from fragments.
            - name: Checkout and install paired backend
              uses: ./.github/actions/paired-backend
              with:
                  repository: ${{ vars.SPEC_SIBLING_REPO || 'Guebbit/boilerplate-node-backend' }}
                  token: ${{ secrets.SPEC_SIBLING_TOKEN || github.token }}
                  path: .spec-sibling
                  report-failure: 'true'
                  no-backend-mode: 'This job only compares contracts, so delete it if this copy has no paired backend'
                  guarded-install: 'true'

            - name: Compare the shared contract files
              env:
                  BACKEND_PATH: .spec-sibling
              run: npm run check:spec-identity

    test-e2e:
        # Cypress against the paired backend's DEMO profile: the real API on an in-memory Mongo,
        # one instance per shard, cache and queue disabled. Fast because nothing persists and
        # nothing is composed — `test-e2e-live` below is the job that attaches the real datastores,
        # and when the two disagree it wins. See docs/tools/demo-profile.md.
        #
        # The sibling checkout is what `scripts/e2e/run-shards.ts` boots, so this job needs it as much
        # as `spec-identity` above does — with its dependencies installed, since the demo profile
        # runs through tsx.
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
        env:
            # Where the backend checkout lands, and what scripts/pairing/paired-backend-path.ts resolves. Same
            # name and same value as e2e-live.yml, so the two e2e jobs describe one layout.
            BACKEND_PATH: .backend
            # How the shard runner boots each demo backend. There is no default in the code —
            # unset means "boot nothing" — so the pairing has to be spelled out here as it is in
            # `.env-example`; this is the Node twin's, the PHP one goes through composer.
            BACKEND_DEMO_COMMAND: npm --prefix {backend} run demo
            # This job is the one place in this workflow that needs it — overrides the workflow's
            # own `CYPRESS_INSTALL_BINARY: '0'` back to unset (which means "install it").
            CYPRESS_INSTALL_BINARY: ''
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - name: Setup Node
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version-file: .nvmrc
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: Cache Cypress binary
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.cache/Cypress
                  key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
                  restore-keys: |
                      cypress-${{ runner.os }}-

            - name: Install dependencies
              run: npm ci

            # The shard runner spawns `npm --prefix .backend run demo`, which is tsx against the
            # backend's own dependency tree — an uninstalled checkout would fail at require time,
            # after the 120s readiness poll rather than at the point of the mistake.
            - name: Checkout and install paired backend
              uses: ./.github/actions/paired-backend
              with:
                  repository: ${{ vars.SPEC_SIBLING_REPO || 'Guebbit/boilerplate-node-backend' }}
                  token: ${{ secrets.SPEC_SIBLING_TOKEN || github.token }}
                  path: ${{ env.BACKEND_PATH }}
                  report-failure: 'true'
                  no-backend-mode: 'The e2e suite boots its demo profile, so there is no backend-less mode'

            - name: Run e2e tests
              run: npm run test:e2e

            - name: Upload failing-shard logs
              # `run-e2e-shards.ts` writes a failed shard's full Cypress output here. Uploaded because
              # stderr is the one copy that can be lost to a truncated log, and once it is the
              # failure is undiagnosable.
              if: failure()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: e2e-shard-logs
                  path: reports/e2e/
                  retention-days: 14
                  if-no-files-found: ignore

            - name: Upload accessibility reports
              # Every axe finding the sweeps saw, the advisory ones included — `cy.checkPageA11y()`
              # gates on serious/critical and writes the rest to `reports/a11y/`. Uploaded on
              # success as well, because the point is the data a green run still produced.
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: a11y-reports
                  path: reports/a11y/
                  retention-days: 14
                  if-no-files-found: ignore

            - name: Upload Cypress screenshots
              if: failure()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: cypress-screenshots
                  path: tests/e2e/screenshots
                  retention-days: 14
                  if-no-files-found: ignore

            - name: Upload Cypress videos
              if: failure()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: cypress-videos
                  path: tests/e2e/videos
                  retention-days: 14
                  if-no-files-found: ignore

    test-e2e-live:
        # The live smoke gate: the tests tagged `@smoke` against the fully composed stack — a real
        # backend checkout, Mongo replica set, Redis, RabbitMQ — within a 15-minute budget. Every
        # journey still runs on every push in `test-e2e` above; what this adds is "the real
        # infrastructure works". The full live run is `e2e-live.yml`'s nightly.
        #
        # Delegated rather than duplicated — `e2e-live.yml` owns the services, the sibling checkout
        # and the seeding, and is also scheduled nightly on its own. Two copies of that setup would
        # drift, which is the exact failure mode this whole job exists to close.
        #
        # Gated on the cheap checks: a live run composes a real backend, Mongo and Redis, and
        # nothing spares that cost for a build that a plain `npm run build` already knows is broken.
        needs:
            - build
            - test-unit
        uses: ./.github/workflows/e2e-live.yml
        with:
            # Only the `@smoke` tests gate a push (E2E-D8); the full live run is the nightly's.
            grep: '@smoke'
        # SPEC_SIBLING_TOKEN, for checking out the paired backend.
        secrets: inherit

    ci:
        # Single status check to require in branch protection, so adding/renaming
        # jobs above doesn't require updating the required-checks list every time.
        if: always()
        # Every job above belongs in this list, `commitlint` included — it now runs on both
        # pull_request and push (see its own comment), so it is always a real pass/fail here.
        needs:
            - commitlint
            - lint
            - prettier
            - lint-openapi
            - lint-asyncapi
            - asyncapi-types-freshness
            - docs-references
            - docker-image
            - audit
            - api-freshness
            - typecheck
            - build
            - test-unit
            - test-e2e
            - test-e2e-live
            - spec-identity
            # `demo-strip-measure` is deliberately excluded — see its own comment above. `audit`
            # is listed, so a high-severity advisory in a production dependency blocks the merge.
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Check all jobs succeeded
              run: |
                  if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
                      echo "One or more required jobs failed."
                      exit 1
                  fi
