name: CI

# The merge gate. Everything here runs on every PR and on every push to main, and the aggregate
# `ci` job at the bottom is the single check to require in branch protection. That rule is a GitHub
# setting, not a file: nothing here enforces it until the repository owner creates it.
#
# Deliberately many small jobs rather than one `npm run complete`: they run in parallel, and
# a red square names the thing that broke (formatting? contract? e2e?) without anyone opening a
# log. The trade is repeated checkout/setup/install boilerplate in each.
#
# The jobs fall into four groups:
#   - style           commitlint, lint, prettier
#   - contract        check — the spec is a copy of the backend's, and the paired backend still
#                     agrees with it (the generated code is not committed: `npm ci` rebuilds it)
#   - correctness     typecheck, build, test-unit, test-e2e
#   - supply chain    audit — report-only: it is not in the `ci` job's `needs:`
#
# The slow and non-hermetic suites live in their own workflows: e2e-live.yml (against a real
# backend; this file calls it as the `test-e2e-live` job and it also runs nightly) and
# mutation.yml (nightly only).

on:
    # Run on every PR and on direct pushes to main.
    # This gives fast feedback for feature branches and protects main.
    pull_request:
    push:
        branches:
            - main

permissions:
    contents: read

concurrency:
    # Cancel stale runs for the same branch/PR when newer commits arrive.
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    # `npm ci` runs cypress's own postinstall, which downloads its ~200 MB binary — needed by
    # `test-e2e` below and nowhere else in this workflow. Set back to unset (which means "install
    # it") only on that one job.
    CYPRESS_INSTALL_BINARY: '0'

jobs:
    commitlint:
        # Push-only backstop: lint the pushed range against .commitlintrc.cjs. A pull request is
        # squash-merged, so its own commits never land; its TITLE becomes the commit subject and
        # is linted by `pr-title.yml` instead.
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  # Need full history to walk the commit range below — every other job's shallow
                  # default is enough, which is why this checkout stays its own step rather than
                  # going through `setup-node-and-install`.
                  fetch-depth: 0
                  persist-credentials: false # no step after the checkout needs the token on disk

            - name: Setup Node and install
              uses: ./.github/actions/setup-node-and-install

            - name: Lint commit messages
              run: npx commitlint --from ${{ github.event.before }} --to ${{ github.event.after }} --verbose

    lint:
        # ESLint over src, tests and scripts.
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false # no step after the checkout needs the token on disk

            - name: Setup Node and install
              uses: ./.github/actions/setup-node-and-install

            - name: Lint
              run: npm run lint

    prettier:
        # Formatting only — a separate job from `lint` so "you forgot to format" and "you wrote
        # a lint error" are two different red squares.
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false # no step after the checkout needs the token on disk

            - name: Setup Node and install
              uses: ./.github/actions/setup-node-and-install

            - name: Check formatting
              run: npm run prettier:check

    docs-build:
        # `docs:build` fails on a dead LINK between pages. The other docs check, a page citing a
        # file that no longer exists, is a step of `npm run check` in the `check` job below.
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false # no step after the checkout needs the token on disk

            - name: Setup Node and install
              uses: ./.github/actions/setup-node-and-install

            - name: Build the docs site
              run: npm run docs:build

    docker-image:
        # Neither this image nor the docs site (job above) was ever built in CI — so a Dockerfile
        # break, or a build arg silently dropped from `docker/Dockerfile.production`, first
        # surfaced on whoever tried to deploy. This builds it and proves the running container
        # actually serves the app at the domain root — the sub-path case is NOT covered here: it
        # needs a design call first, see the note on `docker/nginx.conf`.
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false # no step after the checkout needs the token on disk

            - name: Build the production image
              run: docker build -f docker/Dockerfile.production -t boilerplate-frontend:ci .

            - name: Run it and prove it serves the app
              run: |
                  docker run -d --name frontend-smoke -p 8080:80 \
                    -e VITE_API_URL=http://localhost:3000 \
                    -e VITE_APP_NAME='CI Smoke Test' \
                    boilerplate-frontend:ci
                  # The entrypoint script writes config.js on start; give it a moment before curling.
                  sleep 2

                  echo 'index.html, with the no-store cache headers:'
                  curl --fail --silent --show-error --include http://localhost:8080/ \
                    | tee /tmp/index-headers.txt
                  grep -qi 'cache-control: no-cache, no-store' /tmp/index-headers.txt

                  echo 'config.js, written by the entrypoint from this container'"'"'s own env:'
                  curl --fail --silent --show-error http://localhost:8080/config.js \
                    | tee /tmp/config.js
                  grep -q 'CI Smoke Test' /tmp/config.js

                  echo 'a missing asset is a 404, not the SPA fallback:'
                  status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
                    http://localhost:8080/assets/does-not-exist.js)
                  test "$status" = '404'

                  echo 'a deep link falls back to index.html for vue-router to resolve:'
                  status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
                    http://localhost:8080/en/products/42)
                  test "$status" = '200'

                  echo 'indexing is off by default: noindex on every kind of response, crawling allowed:'
                  for path in / /assets/does-not-exist.js /robots.txt /config.js; do
                    curl --silent --include "http://localhost:8080$path" \
                      | grep -qi '^x-robots-tag: noindex, nofollow'
                  done
                  curl --fail --silent --include http://localhost:8080/robots.txt | tee /tmp/robots.txt
                  grep -qi '^content-type: text/plain' /tmp/robots.txt
                  grep -q '^Allow: /' /tmp/robots.txt
                  # `! grep` would not fail the step under `set -e`, so the refusal is spelled out.
                  if grep -qi '^Sitemap:' /tmp/robots.txt; then exit 1; fi

            - name: Run it with indexing on and prove the header goes and the sitemap is named
              run: |
                  docker run -d --name frontend-indexed -p 8081:80 \
                    -e VITE_API_URL=http://localhost:3000 \
                    -e VITE_ROBOTS_INDEX=true \
                    boilerplate-frontend:ci
                  sleep 2

                  curl --fail --silent --include http://localhost:8081/ | tee /tmp/indexed-headers.txt
                  if grep -qi '^x-robots-tag:' /tmp/indexed-headers.txt; then exit 1; fi

                  curl --fail --silent http://localhost:8081/robots.txt | tee /tmp/indexed-robots.txt
                  grep -qx 'Sitemap: http://localhost:3000/sitemap/index.xml' /tmp/indexed-robots.txt

            - name: Container logs (always, for debugging a failed smoke test)
              if: always()
              run: docker logs frontend-smoke && docker logs frontend-indexed

            - name: Clean up
              if: always()
              run: docker rm -f frontend-smoke frontend-indexed || true

    audit:
        # Scoped to the production dependency tree only: devDependencies (build tooling, codegen,
        # test runners, etc.) are never shipped to users, so a vulnerability there carries a very
        # different risk than one in a package that ends up in the bundle.
        #
        # Deliberately NOT in the `ci` gate's `needs:` below: a new advisory appears upstream
        # overnight, and blocking every PR on something nobody can fix in the same PR just trains
        # people to ignore the check. This still runs on every push/PR and still shows red when it
        # fails — an alert, not a gate, as on the backend and PHP twins. That only stays useful
        # while it is usually GREEN: if an unfixable advisory ever parks this job on red, add an
        # allowlist keyed by advisory id rather than raising the threshold back up.
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false # no step after the checkout needs the token on disk

            - name: Setup Node and install
              uses: ./.github/actions/setup-node-and-install

            - name: Audit production dependencies
              run: npm audit --omit=dev --audit-level=moderate

    typecheck:
        # `vue-tsc` — types across .ts and .vue alike. `build` below repeats it as part of its
        # own script; this job exists so a type error is reported as one, not as a build failure.
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false # no step after the checkout needs the token on disk

            - name: Setup Node and install
              uses: ./.github/actions/setup-node-and-install

            - name: Type check
              run: npm run type-check-only

    build:
        # Proves the app still builds from a clean checkout.
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false # no step after the checkout needs the token on disk

            - name: Setup Node and install
              uses: ./.github/actions/setup-node-and-install

            - name: Build
              run: npm run build-only

    test-unit:
        # Vitest: components, stores, composables and the http layer, in jsdom. No paired backend
        # here — the one unit case that needed a real sibling checkout is `spec-identity`'s own
        # job below, which does its own checkout for exactly that.
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false # no step after the checkout needs the token on disk

            - name: Setup Node and install
              uses: ./.github/actions/setup-node-and-install

            - name: Run unit tests with a JSON report
              # One vitest invocation, two reporters: `default` for the log, `json` for the
              # rollup below.
              run: npm run test:unit:ci

            - name: Per-module test report
              # Reads the JSON the run above already wrote and prints the rollup into the job
              # log, so a red build names the MODULE before anyone opens an artifact. No test run
              # of its own.
              if: always()
              run: npm run test:report

            - name: Upload test report
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: test-report-unit
                  path: reports/test-report.json
                  retention-days: 14
                  if-no-files-found: ignore

    check:
        # `npm run check`: the shared-rules freshness check, the docs-reference sweep and the
        # cross-repo contract gate (spec-identity), in one step, because the last one needs the
        # paired backend checked out and the others cost seconds.
        #
        # The spec-identity half, in detail:
        #
        # Two files exist in BOTH repos, byte-identical — the REST contract and the shared half
        # of the async contract. `scripts/pairing/spec-identity.ts` holds the list and says, per entry,
        # what a fork of it would break — and, for what is deliberately absent, why comparing an
        # OUTPUT of a compared input would add nothing.
        #
        # Until this job existed they were checked by nothing. Every other spec job here lints
        # THIS repo's copy and passes, because a forked spec is still a valid spec. What nobody
        # could see was the fork itself.
        #
        # One of the two sits at a different path in each repo: the async contract is published
        # there as `asyncapi.public.yaml` and received here as `asyncapi.yaml`. That is why the
        # list is path *pairs* rather than names — a same-path check could not express it, so it
        # went unguarded longest.
        #
        # The sibling is checked out read-only, at its default branch: the question is whether this
        # PR agrees with what the backend has actually shipped, not with some pinned older copy.
        #
        # A fork in the pair is a genuine failure, but an unreachable sibling is an infrastructure
        # problem — so `checkout` is allowed to fail and the step below says which of the two
        # happened. A copy of this boilerplate that has no paired backend should delete this job
        # (or `npm run check`'s spec-identity step) rather than watch it fail forever.
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false # no step after the checkout needs the token on disk

            - name: Setup Node and install
              uses: ./.github/actions/setup-node-and-install

            # Same reasoning as test-unit's own step: the sibling's openapi.yaml is gitignored
            # there and only exists once its postinstall assembles it from fragments.
            - name: Checkout and install paired backend
              uses: ./.github/actions/paired-backend
              with:
                  repository: ${{ vars.SPEC_SIBLING_REPO || 'Guebbit/boilerplate-node-backend' }}
                  token: ${{ secrets.SPEC_SIBLING_TOKEN || github.token }}
                  path: .spec-sibling
                  report-failure: 'true'
                  no-backend-mode: 'This job only compares contracts, so delete it if this copy has no paired backend'
                  guarded-install: 'true'

            - name: Run npm run check
              env:
                  BACKEND_PATH: .spec-sibling
              run: npm run check

    resolve-backend:
        # One `git ls-remote` for the whole push, so every `test-e2e` slice checks out the SAME
        # backend commit. Slices start minutes apart (the account runs 20 jobs at a time), and a
        # backend that moved in between would change the demo backend under some slices only.
        runs-on: ubuntu-latest
        timeout-minutes: 2
        permissions:
            contents: read
        outputs:
            sha: ${{ steps.resolve.outputs.sha }}
        steps:
            - name: Resolve the paired backend's default branch
              id: resolve
              env:
                  REPOSITORY: ${{ vars.SPEC_SIBLING_REPO || 'Guebbit/boilerplate-node-backend' }}
                  TOKEN: ${{ secrets.SPEC_SIBLING_TOKEN || github.token }}
              run: |
                  # `HEAD` is the remote's default branch; an unreachable repo leaves the output
                  # empty, and the checkout step then reports it with the usual SPEC_SIBLING advice.
                  sha=$(git ls-remote "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git" HEAD | cut -f1 || true)
                  echo "sha=${sha}" >> "$GITHUB_OUTPUT"

    test-e2e:
        # Cypress against the paired backend's DEMO profile: the real API on an in-memory Mongo,
        # one instance per slice, cache and queue disabled. Fast because nothing persists and
        # nothing is composed — `test-e2e-live` below is the job that attaches the real datastores,
        # and when the two disagree it wins. See docs/tools/demo-profile.md.
        #
        # The sibling checkout is what `scripts/e2e/run-shards.ts` boots, so this job needs it as much
        # as `check` above does — with its dependencies installed, since the demo profile
        # runs through tsx.
        #
        # A matrix, ONE SLICE PER RUNNER: the whole suite on one 4-vCPU runner measured ~178 min of
        # Cypress time against a 75-minute limit. `E2E_SLICE` tells the runner which slice it owns
        # (docs/tools/live-e2e.md#ci-slices). Two axes:
        #   - session-mode: `GET /account/session-config`. The backend boots with `NODE_SESSION_MODE`
        #     set to the value and the journeys read the same name, so both ways of staying signed
        #     in are driven through the real UI.
        #   - shard: 1..5 of the balanced split, plus `antibot`, the specs that need the
        #     human-challenge provider on. Antibot runs in BOTH modes: the cookie leg has failures
        #     of its own there that a jwt-only entry would hide.
        # The slice count (5) is also in `E2E_SLICE` below; change both. Size it from a measured run.
        needs: resolve-backend
        runs-on: ubuntu-latest
        timeout-minutes: 45
        strategy:
            fail-fast: false
            matrix:
                session-mode: [jwt, cookie]
                shard: [1, 2, 3, 4, 5]
                include:
                    - shard: antibot
                      session-mode: jwt
                    - shard: antibot
                      session-mode: cookie
        permissions:
            contents: read
        env:
            E2E_SESSION_MODE: ${{ matrix.session-mode }}
            E2E_SLICE: ${{ matrix.shard == 'antibot' && 'antibot' || format('{0}/5', matrix.shard) }}
            # Where the backend checkout lands, and what scripts/pairing/paired-backend-path.ts resolves. Same
            # name and same value as e2e-live.yml, so the two e2e jobs describe one layout.
            BACKEND_PATH: .backend
            # How the shard runner boots each demo backend. There is no default in the code —
            # unset means "boot nothing" — so the pairing has to be spelled out here as it is in
            # `.env-example`; this is the Node twin's, the PHP one goes through composer.
            BACKEND_DEMO_COMMAND: npm --prefix {backend} run demo
            # This job is the one place in this workflow that needs it — overrides the workflow's
            # own `CYPRESS_INSTALL_BINARY: '0'` back to unset (which means "install it").
            CYPRESS_INSTALL_BINARY: ''
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false # no step after the checkout needs the token on disk

            - name: Setup Node
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version-file: .nvmrc
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: Cache Cypress binary
              uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
              with:
                  path: ~/.cache/Cypress
                  key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
                  restore-keys: |
                      cypress-${{ runner.os }}-

            - name: Install dependencies
              run: npm ci

            # The shard runner spawns `npm --prefix .backend run demo`, which is tsx against the
            # backend's own dependency tree — an uninstalled checkout would fail at require time,
            # after the 120s readiness poll rather than at the point of the mistake.
            - name: Checkout and install paired backend
              uses: ./.github/actions/paired-backend
              with:
                  repository: ${{ vars.SPEC_SIBLING_REPO || 'Guebbit/boilerplate-node-backend' }}
                  token: ${{ secrets.SPEC_SIBLING_TOKEN || github.token }}
                  path: ${{ env.BACKEND_PATH }}
                  ref: ${{ needs.resolve-backend.outputs.sha }}
                  report-failure: 'true'
                  no-backend-mode: 'The e2e suite boots its demo profile, so there is no backend-less mode'
                  # Slice backends start together; see the input's own description.
                  setup-mongod: 'true'

            - name: Run e2e tests
              run: npm run test:e2e

            - name: Upload failing-shard logs
              # `run-shards.ts` writes a failed shard's full Cypress output here. Uploaded because
              # stderr is the one copy that can be lost to a truncated log, and once it is the
              # failure is undiagnosable. `cancelled()` too: the job's 45-minute budget cancels it, and
              # a plain `failure()` skips the upload on exactly the run that most needs the logs
              # (which shard was still running, and on which spec).
              if: failure() || cancelled()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: e2e-shard-logs-${{ matrix.session-mode }}-${{ matrix.shard }}
                  path: reports/e2e/
                  retention-days: 14
                  if-no-files-found: ignore

            - name: Upload accessibility reports
              # Every axe finding the sweeps saw, the advisory ones included — `cy.checkPageA11y()`
              # gates on serious/critical and writes the rest to `reports/a11y/`. Uploaded on
              # success as well, because the point is the data a green run still produced.
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: a11y-reports-${{ matrix.session-mode }}-${{ matrix.shard }}
                  path: reports/a11y/
                  retention-days: 14
                  if-no-files-found: ignore

            - name: Upload Cypress screenshots
              if: failure()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: cypress-screenshots-${{ matrix.session-mode }}-${{ matrix.shard }}
                  path: tests/e2e/screenshots
                  retention-days: 14
                  if-no-files-found: ignore

            - name: Upload Cypress videos
              if: failure()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: cypress-videos-${{ matrix.session-mode }}-${{ matrix.shard }}
                  path: tests/e2e/videos
                  retention-days: 14
                  if-no-files-found: ignore

    test-e2e-live:
        # The live smoke gate: the tests tagged `@smoke` against the fully composed stack — a real
        # backend checkout, Mongo replica set, Redis, RabbitMQ — within a 15-minute budget. Every
        # journey still runs on every push in `test-e2e` above; what this adds is "the real
        # infrastructure works". The full live run is `e2e-live.yml`'s nightly.
        #
        # Delegated rather than duplicated — `e2e-live.yml` owns the services, the sibling checkout
        # and the seeding, and is also scheduled nightly on its own. Two copies of that setup would
        # drift, which is the exact failure mode this whole job exists to close.
        #
        # Gated on the cheap checks: a live run composes a real backend, Mongo and Redis, and
        # nothing spares that cost for a build that a plain `npm run build` already knows is broken.
        needs:
            - build
            - test-unit
        uses: ./.github/workflows/e2e-live.yml
        # A ceiling for the called workflow's own job permissions: `e2e-live-notify` asks for
        # `issues: write`, and GitHub refuses the whole call if the caller grants less.
        permissions:
            contents: read
            issues: write
        with:
            # Only the `@smoke` tests gate a push; the full live run is the nightly's.
            grep: '@smoke'
        # SPEC_SIBLING_TOKEN, for checking out the paired backend.
        secrets: inherit

    ci:
        # Single status check to require in branch protection, so adding/renaming
        # jobs above doesn't require updating the required-checks list every time.
        if: always()
        # Every gating job above belongs in this list, `commitlint` included. It is skipped on a pull
        # request (see its own comment), and a skipped job is neither a failure nor a cancellation.
        needs:
            - commitlint
            - lint
            - prettier
            - docs-build
            - docker-image
            - typecheck
            - build
            - test-unit
            - resolve-backend
            - test-e2e
            - test-e2e-live
            - check
            # `audit` is deliberately excluded — see its own comment above.
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Check all jobs succeeded
              run: |
                  if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
                      echo "One or more required jobs failed."
                      exit 1
                  fi
