name: E2E (live backend)

# Runs this app's Cypress specs against the FULLY COMPOSED backend — a checked-out sibling repo, a
# Mongo replica set, Redis, RabbitMQ, a mail sink and a webhook sink, and a really seeded database
# that persists between requests.
#
# The recipe here is the one in docs/tools/live-e2e.md, service for service and variable for
# variable. Change one, change the other.
#
# TWO TIERS, one workflow (E2E-D8; docs/tools/live-e2e.md#tiers):
#
#   per push   `ci.yml` calls it with `grep: '@smoke'` — one job, only the tests tagged `@smoke`,
#              a 15-minute budget. The push-time question is "does the real infrastructure work",
#              and the smoke set answers it. This is the tier that gates.
#   nightly    the `schedule` below, or a manual run with no `grep` — every test, split into
#              `LIVE_SHARDS` matrix jobs that each get their own services and a sequential slice.
#              It reports; it does not block a push.
#
# `test:e2e` (in ci.yml) runs EVERY journey against the demo profile on every push — in-memory
# Mongo, cache and queue disabled — and runs first, because it is seconds where this is minutes.
# What the demo profile cannot answer is anything that depends on the infrastructure it switches
# off: a cached read served stale, a queued job, a cookie over a real network. That is what this
# workflow adds, and when the two disagree, this one is right.
#
# On failure, read it in this order:
#   1. the `check:spec-identity` step — a failure there means the two checkouts' shared files have
#      forked, so nothing below it is trustworthy;
#   2. anything else — a real disagreement between this frontend and that backend. A spec whose
#      expected rows no longer exist is seed drift, and the backend's
#      `tests/integration/scenarios/shop.test.ts` says whether its seeded scenario still offers
#      every row the modules promise.

on:
    # Called by ci.yml as a required job — see that file's `test-e2e-live`.
    workflow_call:
        inputs:
            grep:
                description: '@cypress/grep tag expression (space = OR, + = AND, - = NOT). Empty runs every test, as the nightly tier.'
                type: string
                default: ''
    schedule:
        # 03:15 UTC — before mutation.yml (03:30), so the two nightlies do not compete for
        # runners. Kept alongside the PR gate: this answers "does main still agree with the
        # backend's default branch", which no PR run can, because the backend moves on its own.
        - cron: '15 3 * * *'
    workflow_dispatch:
        inputs:
            grep:
                description: '@cypress/grep tag expression, e.g. @smoke. Empty runs every test, split like the nightly.'
                type: string
                default: ''

permissions:
    contents: read

concurrency:
    # `inputs.grep` in the key: a smoke run must not cancel the nightly's shards on the same ref.
    group: e2e-live-${{ github.workflow }}-${{ github.ref }}-${{ inputs.grep }}
    cancel-in-progress: true

env:
    # Where the backend checkout lands, and what the frontend's scripts/pairing/paired-backend-path.ts resolves.
    BACKEND_PATH: .backend
    # What `cy.restore()` shells out to between specs. There is no default in the code — unset
    # means "do not reset" — so the pairing has to be spelled out here as it is in `.env-example`;
    # this is the Node twin's, the PHP one goes through composer. `{describeTo}` is where the
    # backend writes the accounts and subject ids: a live deployment mounts no `/__test/scenario`,
    # so this file is the only way the specs learn them.
    #
    # `{scenario}` is where `cy.restore('name')` puts the scenario name (empty for a plain
    # `cy.restore()`, which reseeds the backend's default). `NODE_ENV=development` is set on the
    # command, not job-wide, because a job-wide value would also reach `vite build`; the seeder
    # needs it, since it refuses public fallback passwords outside development/test.
    LIVE_RESET_COMMAND: NODE_ENV=development npm --prefix {backend} run host -- scenario:apply:reset -- {scenario} --describe-to={describeTo}
    # The at-rest encryption keys, job-wide rather than per step: the seed step, the running
    # backend AND every `cy.restore()` (which re-seeds through LIVE_RESET_COMMAND from the Cypress
    # step) must encrypt and decrypt with the same keys. Throwaway values.
    NODE_PII_ENCRYPTION_KEY: ci-not-a-secret-pii-key
    NODE_TOTP_ENCRYPTION_KEY: ci-not-a-secret-totp-key
    NODE_WEBHOOK_SECRET_ENCRYPTION_KEY: ci-not-a-secret-webhook-key
    #
    # The backend's boot config, job-wide because the seed, the running backend AND every
    # `cy.restore()` reseed (from the Cypress step) all boot the app and refuse without it.
    # `host` (below) points the database and Redis at 127.0.0.1; the broker is not
    # among what it sets, so it is named here.
    NODE_RABBITMQ_HOST: 127.0.0.1
    # One process. The default is one worker per core, all fighting over port 3000.
    NODE_CLUSTER_WORKERS: '1'
    # A required key for the personal-data pseudonyms; throwaway, like the ones above.
    NODE_PSEUDONYM_KEY: ci-not-a-secret-pseudonym-key
    # Webhook deliveries go to the tester service; the literal IP is deliberate, as the
    # SSRF guard's DNS lookup skips /etc/hosts.
    NODE_WEBHOOK_DEMO_SINK_URL: http://127.0.0.1:3070
    # src/kernel/required-config.ts refuses to boot without these — throwaway
    # values, same reasoning as scenarios/run-server.ts's own REQUIRED_DEFAULTS:
    # a real deployment's secrets have no place in a CI runner that dies with the job.
    NODE_URL: http://localhost:3000/
    NODE_TOKEN_ACCESS: ci-not-a-secret-access-token
    NODE_TOKEN_REFRESH: ci-not-a-secret-refresh-token
    # The e2e preview serves the app on 8085; the backend's CORS default names only
    # the dev server, and a refused preflight fails every spec before any assertion.
    NODE_CORS_ORIGIN: http://localhost:8085
    # Where mailed links point — the preview, so a spec can open the link it read.
    NODE_FRONTEND_URL: http://localhost:8085
    # Mail goes to the Mailpit service above: plain SMTP on 1025 (the backend only
    # negotiates TLS on 465/587), throwaway credentials Mailpit accepts.
    NODE_MAIL_TRANSPORT: smtp
    # `e2e:serve` refuses any host but localhost, 127.0.0.1, ::1 or mailpit.
    NODE_SMTP_HOST: 127.0.0.1
    NODE_SMTP_PORT: '1025'
    NODE_SMTP_USER: ci
    NODE_SMTP_PASS: ci-not-a-secret
    NODE_SMTP_SENDER: 'CI <noreply@example.com>'
    # The server-side half of the analytics pair. Unset, the backend logs "events
    # are being discarded" and carries on — Umami would be up, the browser tracker
    # would still write, and `analytics.cy.ts` would read one row where it expects
    # one, passing for the wrong reason. `INGEST_HOST` is localhost here, not the
    # compose stack's `http://umami:3000`, because this process runs on the runner
    # rather than inside the job network.
    NODE_ANALYTICS_PROVIDER: umami
    NODE_UMAMI_INGEST_HOST: http://localhost:3080
    NODE_UMAMI_HOST: http://localhost:3080
    NODE_UMAMI_WEBSITE_ID: 00000000-0000-4000-8000-000000000001
    # The live suite drives browsing, login, signup and reset far harder than a person
    # does, from one address. Only these volume budgets are raised, so a limiter cannot
    # silently truncate a spec; payments, invoicing and returns keep their defaults.
    # Raised, not disabled, so a runaway loop still terminates. The global budget is
    # per minute: 1000 still gave 429s on login.
    NODE_RATE_LIMIT_MAX: '100000'
    NODE_AUTH_RATE_LIMIT_MAX: '1000'
    NODE_AUTH_RATE_LIMIT_ADDRESS_MAX: '1000'
    NODE_SIGNUP_RATE_LIMIT_MAX: '1000'
    NODE_RESET_RATE_LIMIT_MAX: '1000'
    NODE_METRICS_TOKEN: ci-metrics-token

jobs:
    # Decides the tier: a tag expression means the per-push smoke run (one job, short budget);
    # none means the nightly (a matrix, longer budget per job). Kept in one place so the matrix
    # and the timeout cannot disagree about which tier this is.
    plan:
        runs-on: ubuntu-latest
        timeout-minutes: 2
        permissions:
            contents: read
        outputs:
            matrix: ${{ steps.tier.outputs.matrix }}
            timeout: ${{ steps.tier.outputs.timeout }}
        steps:
            - name: Pick the tier
              id: tier
              env:
                  # Through env, never interpolated into the script: it is caller-supplied text.
                  GREP: ${{ inputs.grep }}
                  # The nightly's slice count. The full live run is ~85-115 min sequential, so 4
                  # slices land at ~30 min each; raise it as journeys are added.
                  LIVE_SHARDS: '4'
              run: |
                  if [ -n "$GREP" ]; then
                      echo 'matrix={"shard":[1],"total":[1]}' >> "$GITHUB_OUTPUT"
                      echo 'timeout=15' >> "$GITHUB_OUTPUT"
                  else
                      shards=$(seq -s, 1 "$LIVE_SHARDS")
                      echo "matrix={\"shard\":[$shards],\"total\":[$LIVE_SHARDS]}" >> "$GITHUB_OUTPUT"
                      echo 'timeout=45' >> "$GITHUB_OUTPUT"
                  fi

    test-e2e-live:
        needs: plan
        runs-on: ubuntu-latest
        # Per tier — see `plan`. Not a literal: 15 is the smoke budget, 45 one nightly slice.
        timeout-minutes: ${{ fromJSON(needs.plan.outputs.timeout) }}
        # Every matrix job has its OWN services below and its own database, which is what lets the
        # slices run in parallel: live specs share one seeded Mongo and cannot share it across jobs.
        strategy:
            fail-fast: false
            matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
        permissions:
            contents: read

        # The real infrastructure. This is the only workflow that needs it: every other suite runs
        # on mongodb-memory-server with no cache and no broker, so nothing else here talks to a
        # database that persists between requests. Health checks gate the steps below — a container
        # that is up but not yet accepting connections would fail the seed step in a way that reads
        # as a bad seed. Mongo is not here: it must be a replica set, which needs a command run
        # after it starts, so the "Start Mongo" step below owns it.
        services:
            redis:
                # redis:8
                image: redis@sha256:718f745deb7dfefeac6eed7041fc7ec9476b50e61b247932682457c41adafa0e
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 10

            # The broker. Workers run inside the API process, so nothing else is started; without it
            # the queue-backed paths (webhook delivery, mail jobs) never leave `pending` and a spec
            # that waits on them fails as a timeout rather than as a missing service.
            rabbitmq:
                # rabbitmq:4-management
                image: rabbitmq@sha256:6ec83ef56205ce7cc6f8a762f28fdeeab50f52e8f79becbac5a3a4c7293a379a
                ports:
                    - 5672:5672
                options: >-
                    --health-cmd "rabbitmq-diagnostics -q ping"
                    --health-interval 10s
                    --health-timeout 10s
                    --health-retries 10
            # Where outbound webhooks land, so a delivery is real and its signature is checkable
            # from the tester's API. The backend's SSRF guard exempts exactly this URL
            # (`NODE_WEBHOOK_DEMO_SINK_URL`, development only). Host port 3070 matches the backend's
            # own compose service. No health check: the image is minimal, so "Wait for the
            # backend" waits on the port instead.
            # https://github.com/tarampampam/webhook-tester
            webhook-tester:
                # ghcr.io/tarampampam/webhook-tester:2.3.0
                image: ghcr.io/tarampampam/webhook-tester@sha256:85818267b450d3d386cad6510c561e09b974183ed2832c373bc83b125fc1b221
                ports:
                    - 3070:8080
                env:
                    # A POST to any uuid creates that session, which a seeded subscription cannot
                    # do by clicking "new URL" first.
                    AUTO_CREATE_SESSIONS: 'true'
                    STORAGE_DRIVER: memory

            # Umami, and the Postgres behind it. Here because `analytics.cy.ts` is the one spec
            # neither repo's own suite can replace: this frontend's browser tracker and the
            # backend's server-side one write into ONE website, and the bug it guards — both sides
            # firing `cart_item_added`, every count reading double — was invisible from inside
            # either. Asking "how many rows exist" needs a real Umami with both trackers pointed
            # at it, which only this workflow has.
            umami-db:
                # postgres:16-alpine
                image: postgres@sha256:1a66d744c1b459e13b05a8fca341da84cb63383e99ce262210efee5a319d4551
                ports:
                    - 5432:5432
                env:
                    POSTGRES_USER: umami
                    POSTGRES_PASSWORD: umami
                    POSTGRES_DB: umami
                options: >-
                    --health-cmd "pg_isready -U umami"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 10
            # The SMTP catcher the live backend mails into, so the flows that hinge on a mailed
            # code or link — 2FA, password reset, verification — run here instead of skipping.
            # CI and test only: a deployment configures its own provider (`NODE_SMTP_*`); nothing
            # in either repo names one. `cy.emailTo()` reads it over the HTTP API on 8025.
            # https://mailpit.axllent.org/docs/
            mailpit:
                # axllent/mailpit:v1.31.2
                image: axllent/mailpit@sha256:45e5823c8e8f4b948f62e7fac4558490b36992e25f4a8e9e8a8647eecba35624
                ports:
                    - 1025:1025
                    - 8025:8025
                env:
                    # The backend always authenticates (its SMTP settings are all-or-nothing), and
                    # Mailpit offers AUTH only when told to accept any credentials, over plain SMTP.
                    MP_SMTP_AUTH_ACCEPT_ANY: 'true'
                    MP_SMTP_AUTH_ALLOW_INSECURE: 'true'
            umami:
                # ghcr.io/umami-software/umami:postgresql-v2.14.0
                image: ghcr.io/umami-software/umami@sha256:29f3ce0013f7f3cfe19584bda254d1b6b6214ca47023b532e12d850505c1da9e
                ports:
                    # 3080 on the host, matching the compose stack and the frontend's
                    # VITE_UMAMI_SRC default, so nothing has to know it is running in CI.
                    - 3080:3000
                env:
                    DATABASE_TYPE: postgresql
                    # Service containers reach each other by label on the job network.
                    DATABASE_URL: postgresql://umami:umami@umami-db:5432/umami
                    APP_SECRET: ci-not-a-secret

        steps:
            - name: Checkout frontend
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - name: Setup Node
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version-file: .nvmrc
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: Cache Cypress binary
              # ~200 MB that `npm ci` would otherwise re-download every night.
              uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
              with:
                  path: ~/.cache/Cypress
                  key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
                  restore-keys: |
                      cypress-${{ runner.os }}-

            - name: Install frontend dependencies
              run: npm ci

            # The other half of the pair, at its default branch: the question is whether this
            # commit agrees with what the backend has actually shipped, not with a pinned copy.
            # Separately from the frontend's: two lockfiles, two node_modules, one runner.
            - name: Checkout and install paired backend
              uses: ./.github/actions/paired-backend
              with:
                  repository: ${{ vars.SPEC_SIBLING_REPO || 'Guebbit/boilerplate-node-backend' }}
                  token: ${{ secrets.SPEC_SIBLING_TOKEN || github.token }}
                  path: ${{ env.BACKEND_PATH }}

            # A single-node replica set, because the backend runs multi-document transactions and a
            # standalone `mongod` refuses them (BE `runtime/database.ts`, `withTransaction`). A
            # service container cannot run `rs.initiate` after it starts, so this is a step.
            # The member host must be 127.0.0.1: it is what the driver is told to reconnect to.
            # https://www.mongodb.com/docs/manual/tutorial/deploy-replica-set/
            - name: Start Mongo as a single-node replica set
              run: |
                  # mongo:8
                  docker run -d --name mongo -p 27017:27017 \
                      mongo@sha256:5d7043a4ffe02b9ed1b6e0bab057546981af5ca0a79107e9c461e49bc44c0a7b \
                      --replSet rs0 --bind_ip_all
                  until docker exec mongo mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' >/dev/null 2>&1; do sleep 2; done
                  docker exec mongo mongosh --quiet --eval 'rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "127.0.0.1:27017" }] })'
                  # Wait for the election: a seed that starts before there is a primary fails on its
                  # first write.
                  until docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; do sleep 2; done

            # The specs are written against the seed dataset, so the database has to hold it
            # before anything starts — and `cy.restore()` re-runs the seed between specs, which
            # is what `LIVE_RESET_COMMAND` above runs.
            #
            # `host` is a PREFIX runner, not a suffix: it exports the localhost database and cache
            # variables and then invokes `npm run` with whatever follows the `--`. There is no
            # `db:bootstrap:host` script to call.
            - name: Migrate and seed
              working-directory: ${{ env.BACKEND_PATH }}
              env:
                  # `host` already points the database and cache at 127.0.0.1. `development` is what
                  # lets the seeder use its public demo passwords.
                  NODE_ENV: development
              run: npm run host -- db:bootstrap

            # Umami seeds a fixed admin account on first boot but offers no env var for its
            # credentials, and no way to pre-create a website. The backend's own init script does
            # both, against Postgres directly — the same one its compose stack runs, so CI and a
            # developer's machine come up identical. A step rather than a service container:
            # services start before checkout, and this needs the script from the backend repo.
            #
            # It waits for Umami's migrations itself (`until` on the seeded admin row), so it also
            # serves as the readiness gate for the container above.
            - name: Stamp the Umami admin and website
              working-directory: ${{ env.BACKEND_PATH }}
              env:
                  DATABASE_URL: postgresql://umami:umami@localhost:5432/umami
                  UMAMI_ADMIN_USER: admin
                  UMAMI_ADMIN_PASSWORD: umami
                  UMAMI_WEBSITE_ID: 00000000-0000-4000-8000-000000000001
                  UMAMI_WEBSITE_NAME: Frontend
                  UMAMI_WEBSITE_DOMAIN: localhost
              run: sh docker/observability/umami-init.sh

            # Backgrounded, with its PID kept so the teardown step can stop it. Its stdout goes
            # to a file rather than the step log: the log is uploaded as an artifact below, and a
            # backend that logs continuously would otherwise bury the Cypress output.
            - name: Start the backend
              working-directory: ${{ env.BACKEND_PATH }}
              env:
                  # see the job-wide env for the rest; only NODE_ENV differs by step, because `development`
                  # job-wide would also reach `vite build`. It is also what the webhook sink requires:
                  # the sink exemption is refused in production.
                  NODE_ENV: development
              # `e2e:serve` is `start` plus the mark that makes boot refuse a real SMTP host, so a
              # live run cannot send mail. `host` is a prefix runner (see the seed step).
              run: |
                  npm run host -- e2e:serve > "$GITHUB_WORKSPACE/backend.log" 2>&1 &
                  echo $! > "$GITHUB_WORKSPACE/backend.pid"

            # Nothing downstream retries a connection, so without this the first spec would race
            # the server's startup and fail on a network error rather than on an assertion.
            - name: Wait for the backend
              run: npx wait-on http://localhost:3000 tcp:127.0.0.1:3070 --timeout 120000

            # Before spending minutes on Cypress: are the two checkouts still the same pair? A
            # forked `openapi.yaml` makes the run fail on shapes rather than on behaviour, which
            # reads as a broken app instead of a stale checkout.
            - name: Check the shared files are identical across the two checkouts
              run: npm run check:spec-identity

            # The point of the whole workflow: the same specs as `test-e2e` in ci.yml, against
            # the composed stack rather than the demo profile's in-memory database.
            #
            # The `VITE_UMAMI_*` pair is BUILD-time: this script runs `build:e2e` first, and Vite
            # inlines them then. There is no `.env` on a runner, so without them
            # `readUmamiConfig()` returns undefined, the tracker is never injected, and
            # `analytics.cy.ts` fails on its control assertion — which reads as a broken Umami
            # rather than a build that was never told about one. The website id is the same fixed
            # UUID the init step stamped, so both trackers write into one website, which is the
            # arrangement the spec exists to police.
            - name: Run e2e tests against the live backend
              env:
                  # `cy.emailTo()` reads the Mailpit service; `cy.restore()` empties it.
                  MAILPIT_URL: http://localhost:8025
                  VITE_UMAMI_SRC: http://localhost:3080/script.js
                  VITE_UMAMI_WEBSITE_ID: 00000000-0000-4000-8000-000000000001
                  # The tier's tag filter (empty = every test), read by cypress.config.ts.
                  E2E_GREP_TAGS: ${{ inputs.grep }}
                  # This job's slice of the suite, so the matrix jobs cover it exactly once between
                  # them (a smoke run is the one slice of one).
                  SHARD: ${{ matrix.shard }}
                  TOTAL: ${{ matrix.total }}
              run: |
                  # A tag no spec carries makes Cypress fail with "no spec files were found", which
                  # reads as a broken run. Say so as a warning and stop instead: the tier is simply
                  # empty. Only positive tags are checked; an expression of exclusions runs as is.
                  tags="$(echo "$E2E_GREP_TAGS" | grep -oE '(^|[ +])@[A-Za-z0-9_-]+' | tr -d ' +' | paste -sd'|' || true)"
                  if [ -n "$tags" ] && ! grep -rqE --include='*.cy.ts' -- "$tags" tests/e2e src/modules; then
                      echo "::warning::No spec carries $E2E_GREP_TAGS, so this tier ran nothing."
                      exit 0
                  fi
                  E2E_SPEC="$(npx tsx scripts/e2e/print-live-shard.ts "$SHARD" "$TOTAL")" npm run test:e2e:live:spec

            # Tests that passed only on Cypress' one retry, as warning annotations — flaky rather
            # than green, and never failing the job. The sharded demo run prints its own.
            - name: Report tests that passed only on a retry
              if: always()
              run: npx tsx scripts/e2e/report-flaky.ts

            # `always()` so a failed run does not leave the process holding the port for whatever
            # the runner does next.
            - name: Stop the backend
              if: always()
              run: kill "$(cat "$GITHUB_WORKSPACE/backend.pid")" || true

            - name: Upload backend log
              # Uploaded even on success: a green run whose log is full of 500s is worth seeing.
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: backend-log-${{ matrix.shard }}
                  path: backend.log
                  retention-days: 14
                  if-no-files-found: warn

            # Failure only. Read these together with the backend log above: a spec that failed on
            # a 500 is a backend problem, one that failed on a wrong value is usually seed drift.
            - name: Upload Cypress screenshots
              if: failure()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: cypress-screenshots-live-${{ matrix.shard }}
                  path: tests/e2e/screenshots
                  retention-days: 14
                  if-no-files-found: ignore

            - name: Upload Cypress videos
              # Same, for the specs where the failure is a sequence rather than a single frame.
              if: failure()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: cypress-videos-live-${{ matrix.shard }}
                  path: tests/e2e/videos
                  retention-days: 14
                  if-no-files-found: ignore

            - name: Upload accessibility reports
              # Same artifact `ci.yml`'s demo-profile job uploads, from the live stack: every axe
              # finding `cy.checkPageA11y()` saw, written to `reports/a11y/` — advisory ones too.
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: a11y-reports-live-${{ matrix.shard }}
                  path: reports/a11y/
                  retention-days: 14
                  if-no-files-found: ignore
