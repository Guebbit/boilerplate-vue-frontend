name: E2E (live backend)

# Runs this app's Cypress specs against a REAL backend — a checked-out sibling repo, a real
# Mongo and Redis, a really seeded database — instead of against MSW.
#
# THIS IS THE MERGE GATE. `ci.yml` calls it via `workflow_call`, so behaviour is proven against the
# real API on every PR rather than against a mock that claims to resemble one.
#
# That is a deliberate reversal. The mock suite used to be the gate, and MSW carried a promise it
# could not keep on its own: that each handler applied the same filtering, scoping and visibility
# rules as the backend service behind it. Nothing enforced that promise mechanically — two spec
# files and the reviewer's memory did — and the failure it invites is the expensive one: a green
# suite describing an API that does not exist. Rather than keep paying reviewers to hold a mirror
# straight, the mirror stopped being load-bearing and the real thing became the gate.
#
# `test:e2e` (in ci.yml) still runs the same specs against MSW, and still runs first, because it is
# seconds where this is minutes and it catches ordinary app regressions long before this finishes.
# What it no longer does is CERTIFY anything about the backend. When the two disagree, this one is
# right.
#
# On failure, read it in this order:
#   1. the `check:spec-identity` step — a failure there means the two checkouts' shared files have
#      forked, so nothing below it is trustworthy;
#   2. anything else — a real disagreement between this frontend and that backend. A spec whose
#      expected rows no longer exist is seed drift, and the backend's
#      `tests/unit/db/migration-demo-data.test.ts` says whether its migrations caused it.

on:
    # Called by ci.yml as a required job — see that file's `test-e2e-live`.
    workflow_call:
    schedule:
        # 03:15 UTC — before mutation.yml (03:30), so the two nightlies do not compete for
        # runners. Kept alongside the PR gate: this answers "does main still agree with the
        # backend's default branch", which no PR run can, because the backend moves on its own.
        - cron: '15 3 * * *'
    workflow_dispatch:

concurrency:
    group: e2e-live-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    NODE_VERSION: 22
    # Where the backend checkout lands, and what the frontend's scripts/backend-path.ts resolves.
    BACKEND_PATH: .backend

jobs:
    test-e2e-live:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read

        # The real datastores. This is the only workflow that needs them: every other suite uses
        # mongodb-memory-server or MSW, so nothing else here talks to a database that persists
        # between requests. Health checks gate the steps below — a container that is up but not
        # yet accepting connections would fail the seed step in a way that reads as a bad seed.
        services:
            mongodb:
                image: mongo:8
                ports:
                    - 27017:27017
                options: >-
                    --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 10
            redis:
                image: redis:8
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 10

        steps:
            - name: Checkout frontend
              uses: actions/checkout@v4

            # The other half of the pair, at its default branch: the question is whether this
            # commit agrees with what the backend has actually shipped, not with a pinned copy.
            - name: Checkout backend
              uses: actions/checkout@v4
              with:
                  repository: ${{ vars.SPEC_SIBLING_REPO || 'Guebbit/boilerplate-node-backend' }}
                  path: ${{ env.BACKEND_PATH }}
                  token: ${{ secrets.SPEC_SIBLING_TOKEN || github.token }}

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: Cache Cypress binary
              # ~200 MB that `npm ci` would otherwise re-download every night.
              uses: actions/cache@v4
              with:
                  path: ~/.cache/Cypress
                  key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
                  restore-keys: |
                      cypress-${{ runner.os }}-

            - name: Install frontend dependencies
              run: npm ci

            # Separately from the frontend's: two lockfiles, two node_modules, one runner.
            - name: Install backend dependencies
              working-directory: ${{ env.BACKEND_PATH }}
              run: npm ci

            # The specs are written against the seed dataset, so the database has to hold it
            # before anything starts — and `cy.resetState()` re-runs this same script between
            # specs, which is why the backend's `db:seed:reset:host` script is the one used.
            - name: Migrate and seed
              working-directory: ${{ env.BACKEND_PATH }}
              env:
                  NODE_DB_URI: ''
                  NODE_MONGODB_HOST: localhost
                  NODE_REDIS_URL: ''
                  NODE_REDIS_HOST: localhost
              run: npm run db:bootstrap:host

            # Backgrounded, with its PID kept so the teardown step can stop it. Its stdout goes
            # to a file rather than the step log: the log is uploaded as an artifact below, and a
            # backend that logs continuously would otherwise bury the Cypress output.
            - name: Start the backend
              working-directory: ${{ env.BACKEND_PATH }}
              env:
                  NODE_DB_URI: ''
                  NODE_MONGODB_HOST: localhost
                  NODE_REDIS_URL: ''
                  NODE_REDIS_HOST: localhost
                  # The live suite drives login, signup and reset far harder than a person does,
                  # from one address. Same reasoning as tests/helpers/setup.ts in the backend:
                  # raised so the limiter cannot silently truncate a spec, not disabled, so a
                  # runaway loop still terminates.
                  NODE_RATE_LIMIT_MAX: '1000'
                  NODE_AUTH_RATE_LIMIT_MAX: '1000'
                  NODE_METRICS_TOKEN: ci-metrics-token
              run: |
                  npm start > "$GITHUB_WORKSPACE/backend.log" 2>&1 &
                  echo $! > "$GITHUB_WORKSPACE/backend.pid"

            # Nothing downstream retries a connection, so without this the first spec would race
            # the server's startup and fail on a network error rather than on an assertion.
            - name: Wait for the backend
              run: npx wait-on http://localhost:3000 --timeout 120000

            # Before spending minutes on Cypress: are the two checkouts still the same pair? A
            # forked `demo-data.json` makes the run fail on data rather than on behaviour,
            # which reads as a broken app instead of a stale checkout.
            - name: Check the shared files are identical across the two checkouts
              run: npm run check:spec-identity

            # The point of the whole workflow: the same specs as `test-e2e` in ci.yml, with MSW
            # off, so they run against the real API and the real seeded database.
            - name: Run e2e tests against the live backend
              run: npm run test:e2e:live

            # `always()` so a failed run does not leave the process holding the port for whatever
            # the runner does next.
            - name: Stop the backend
              if: always()
              run: kill "$(cat "$GITHUB_WORKSPACE/backend.pid")" || true

            - name: Upload backend log
              # Uploaded even on success: a green run whose log is full of 500s is worth seeing.
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: backend-log
                  path: backend.log
                  retention-days: 14
                  if-no-files-found: warn

            # Failure only. Read these together with the backend log above: a spec that failed on
            # a 500 is a backend problem, one that failed on a wrong value is usually seed drift.
            - name: Upload Cypress screenshots
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: cypress-screenshots-live
                  path: tests/e2e/screenshots
                  retention-days: 14
                  if-no-files-found: ignore

            - name: Upload Cypress videos
              # Same, for the specs where the failure is a sequence rather than a single frame.
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: cypress-videos-live
                  path: tests/e2e/videos
                  retention-days: 14
                  if-no-files-found: ignore
